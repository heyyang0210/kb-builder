<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/knowledge-center/">
  <title>知识中心管理</title>
  <link rel="stylesheet" href="./common/tokens.css">
  <link rel="stylesheet" href="./common/base.css">
  <link rel="stylesheet" href="./common/components.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./modules/dashboard/dashboard.css">
  <link rel="stylesheet" href="./modules/outlines/outlines.css">
  <link rel="stylesheet" href="./modules/production/production.css">
  <link rel="stylesheet" href="./modules/repository/repository.css">
  <link rel="stylesheet" href="./modules/auth/login.css">
</head>
<body>
  <section id="auth-loading" class="auth-loading" aria-live="polite">
    <span class="auth-loading-mark" aria-hidden="true"></span>
    <p>正在检查登录状态</p>
  </section>
  <section id="auth-shell" class="auth-shell" aria-labelledby="auth-title" aria-busy="true" hidden>
    <div class="auth-panel">
      <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><i data-lucide="book-open-check"></i></span><div><h1 id="auth-title">知识中心管理</h1><p>企业知识资产协作与治理平台</p></div></div>
      <div id="auth-status" class="auth-status" role="status" aria-live="polite">正在检查登录状态</div>
      <div id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></div>
      <button id="auth-retry" class="button secondary auth-retry" type="button" hidden>重新检查</button>
      <button id="cas-login" class="button auth-primary" type="button">统一认证登录</button>
      <p class="auth-hint">使用企业统一认证账号访问知识业务空间。</p>
      <details class="admin-login-details" id="admin-login-details">
        <summary>平台管理登录</summary>
        <p class="auth-hint">仅用于平台管理和权限分配，不影响普通知识业务权限。</p>
        <form id="admin-login-form" novalidate>
          <label for="admin-username">管理员账号</label>
          <input id="admin-username" name="username" autocomplete="username" required>
          <label for="admin-password">管理员密码</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          <button id="admin-submit" class="button secondary" type="submit">登录平台管理</button>
        </form>
      </details>
    </div>
  </section>
  <button class="skip-link" id="skip-to-main" type="button">跳到主要内容</button>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="主导航" aria-hidden="false">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i data-lucide="book-open-check"></i></span>
        <div class="brand-copy">
          <strong>知识中心管理</strong>
          <small id="enterprise-name">读取企业配置中</small>
        </div>
        <button class="sidebar-control" id="sidebar-collapse" type="button" aria-label="收缩导航" title="收缩导航">
          <i data-lucide="panel-left-close" aria-hidden="true"></i>
        </button>
        <button class="sidebar-control mobile-close" id="mobile-close" type="button" aria-label="关闭导航" title="关闭导航">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="nav-wrap" aria-label="功能导航">
        <p class="nav-caption">工作区</p>
        <button class="nav-item active" data-view="dashboard" aria-label="工作台" title="工作台"><i class="nav-icon" data-lucide="layout-dashboard" aria-hidden="true"></i><span class="nav-copy"><b>工作台</b><small>任务、资产与风险</small></span></button>
        <button class="nav-item" data-view="assets" aria-label="知识资产" title="知识资产"><i class="nav-icon" data-lucide="library" aria-hidden="true"></i><span class="nav-copy"><b>知识资产</b><small>手册、文档与版本</small></span></button>
        <button class="nav-item" data-view="cleaning" aria-label="资料清洗" title="资料清洗"><i class="nav-icon" data-lucide="filter" aria-hidden="true"></i><span class="nav-copy"><b>资料清洗</b><small>批次、知识点与索引</small></span></button>
        <button class="nav-item" data-view="outlines" aria-label="大纲管理" title="大纲管理"><i class="nav-icon" data-lucide="list-tree" aria-hidden="true"></i><span class="nav-copy"><b>大纲管理</b><small>目录与责任映射</small></span></button>
        <button class="nav-item" data-view="templates" aria-label="模板管理" title="模板管理"><i class="nav-icon" data-lucide="files" aria-hidden="true"></i><span class="nav-copy"><b>模板管理</b><small>正文、版本与适用范围</small></span></button>
        <button class="nav-item" data-view="production" aria-label="文档生产" title="文档生产"><i class="nav-icon" data-lucide="workflow" aria-hidden="true"></i><span class="nav-copy"><b>文档生产</b><small>来源、策略与任务</small></span></button>
        <button class="nav-item" data-view="review" aria-label="审核与发布" title="审核与发布"><i class="nav-icon" data-lucide="badge-check" aria-hidden="true"></i><span class="nav-copy"><b>审核与发布</b><small>候选、评论与发布</small></span></button>
        <p class="nav-caption governance">治理</p>
        <button class="nav-item" data-view="platform" aria-label="平台管理" title="平台管理"><i class="nav-icon" data-lucide="settings" aria-hidden="true"></i><span class="nav-copy"><b>平台管理</b><small>连接、权限与审计</small></span></button>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot" id="platform-dot"></span>
        <span class="sidebar-status" id="platform-status">正在检查平台</span>
        <span class="sidebar-user" id="sidebar-user" aria-live="polite"></span>
        <button id="logout" class="sidebar-control" type="button" aria-label="退出登录" title="退出登录"><i data-lucide="log-out" aria-hidden="true"></i></button>
        <button id="sidebar-hide" class="sidebar-control" type="button" aria-label="完全隐藏导航" title="完全隐藏导航"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整导航宽度" aria-valuemin="200" aria-valuemax="360" aria-valuenow="248" tabindex="0"><span id="resize-label">248px</span></div>
    </aside>
    <button id="sidebar-restore" class="sidebar-restore" type="button" aria-label="展开导航" title="展开导航"><i data-lucide="panel-left-open" aria-hidden="true"></i><span>展开导航</span></button>
    <button id="mobile-menu" class="mobile-menu" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu" aria-hidden="true"></i><span>菜单</span></button>
    <div class="mobile-overlay" id="mobile-overlay" hidden></div>
    <div class="main-shell" id="main-shell">
      <h1 id="page-title" class="sr-only">工作台</h1>
      <main id="main" tabindex="-1">
        <section id="error-panel" class="notice" hidden>
          <div><strong>平台数据暂时不可用</strong><p id="error-message">请稍后重试。</p></div>
          <button id="retry" class="button secondary" type="button">重新检查</button>
        </section>
        <div id="view-root"></div>
      </main>
    </div>
  </div>
  <script src="./common/vendor/lucide.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
