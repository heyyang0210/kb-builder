ass="section-title">处理进度</div><div class="timeline"><div class="step done"><strong>工单范围确认</strong><small>何灿选定 2 本手册并转交</small></div><div class="step now"><strong>手册与文档处理</strong><small>1 本手册待判断 · 1 篇文档待修订</small></div><div class="step"><strong>交付与整单完成</strong><small>需人工合并和目标正文、图片回读</small></div></div></div><div class="drawerfoot"><button class="btn" data-action="progress">查看整体进度</button><button class="btn primary" data-action="handbook">确认手册范围</button></div></div>`}
function handbookModal(){return `<div class="modal" role="dialog" aria-modal="true" aria-label="选择涉及的手册"><div class="modalhead"><div><h2>选择涉及的手册</h2><div class="sub">YDBRD-60778 · 安装与 SQL 兼容性调整</div></div><button class="iconbtn" data-action="close-modal" aria-label="关闭弹窗">${icon('x')}</button></div><div class="modalbody"><div class="phase"><span class="done">1 影响判断 ✓</span> → <span class="active">2 选择手册</span> → <span>3 转交手册负责人</span></div><div class="choice"><label><input type="radio" name="scope" value="involved" ${state.scope==='involved'?'checked':''}> 涉及文档变更</label><label><input type="radio" name="scope" value="not" ${state.scope==='not'?'checked':''}> 不涉及文档变更</label></div>${state.scope==='not'?reasonFields('工单'): `<div class="modalbar"><input class="search" id="handbook-query" placeholder="搜索手册名称" aria-label="搜索手册名称" value="${state.handbookQuery}"><span class="count">已选 ${state.handbooks.size} 本</span></div><div class="scope-list">${handbooks.filter(h=>h[1].includes(state.handbookQuery)).map(h=>`<div class="scope-row"><div><label class="checkline"><input type="checkbox" data-handbook="${h[0]}" ${state.handbooks.has(h[0])?'checked':''}><strong>${h[1]}</strong></label><span class="muted">${h[2]}</span></div>${personSelect(state.handbookOwners[h[0]]||'',`data-handbook-owner="${h[0]}" ${state.handbooks.has(h[0])?'':'disabled'}`)}</div>`).join('')||'<p class="note" style="padding:10px">没有匹配的手册</p>'}</div><p class="note">确认后转交各手册负责人；他们将分别决定本手册的文档范围。</p>`}<div class="error" id="form-error">${state.error}</div></div><div class="modalfoot"><span class="sub">保存草稿不会创建下级待办</span><div class="inline"><button class="btn" data-action="save-draft">保存草稿</button><button class="btn primary" data-action="confirm-handbook">${state.scope==='not'?'确认不涉及并完成':'确认并转交'}</button></div></div></div>`}
function reasonFields(level){return `<div class="field"><label for="reason">${level}不涉及的理由 *</label><select id="reason"><option value="">请选择理由</option><option value="no-impact" ${state.reason==='no-impact'?'selected':''}>变更不影响现有文档</option><option value="duplicate" ${state.reason==='duplicate'?'selected':''}>已有文档覆盖</option><option value="other" ${state.reason==='other'?'selected':''}>其他</option></select></div>${state.reason==='other'?`<div class="field"><label for="reason-other">补充说明 *</label><textarea id="reason-other" placeholder="填写具体原因">${state.reasonOther}</textarea></div>`:''}<p class="note">${level==='工单'?'工单责任人确认后，平台文档任务关闭；不会回写 PingCode 状态。':'此理由仅适用于当前手册，其他手册继续独立处理。'}</p>`}
function documentModal(){return `<div class="modal" role="dialog" aria-modal="true" aria-label="确认手册文档范围"><div class="modalhead"><div><h2>确认手册文档范围</h2><div class="sub">YDBRD-60778 / 安装部署手册 · 手册负责人 张宁</div></div><button class="iconbtn" data-action="close-modal" aria-label="关闭弹窗">${icon('x')}</button></div><div class="modalbody"><div class="phase"><span class="done">工单已转交 ✓</span> → <span class="active">本手册影响判断</span> → <span>分派文档负责人</span></div><div class="choice"><label><input type="radio" name="docscope" value="involved" ${state.docScope==='involved'?'checked':''}> 涉及文档变更</label><label><input type="radio" name="docscope" value="not" ${state.docScope==='not'?'checked':''}> 本手册不涉及</label></div>${state.docScope==='not'?reasonFields('手册'):`<div class="modalbar"><input class="search" id="document-query" placeholder="搜索已有文档" aria-label="搜索已有文档" value="${state.documentQuery}"><span class="count">已选 ${state.documents.size} 篇</span></div><div class="scope-list">${documents.filter(d=>d[1].includes(state.documentQuery)).map(d=>`<div class="scope-row"><div><label class="checkline"><input type="checkbox" data-document="${d[0]}" ${state.documents.has(d[0])?'checked':''}><strong>${d[1]}</strong></label><span class="muted">${d[2]}</span></div>${personSelect(state.documentOwners[d[0]]||'',`data-document-owner="${d[0]}" ${state.documents.has(d[0])?'':'disabled'}`)}</div>`).join('')||'<p class="note" style="padding:10px">没有匹配的文档</p>'}</div><div class="inline" style="margin-top:11px"><button class="btn small" data-action="new-document">${icon('file-plus-2')}提出新增文档</button><span class="muted" style="font-size:12px">在指定章节下创建；开始处理前选目标版本</span></div>`}<div class="error" id="form-error">${state.error}</div></div><div class="modalfoot"><span class="sub">仅确认当前手册，不影响其他手册</span><div class="inline"><button class="btn" data-action="save-draft">保存草稿</button><button class="btn primary" data-action="confirm-document">${state.docScope==='not'?'确认本手册不涉及':'确认并分派'}</button></div></div></div>`}
function smallModal(kind){if(kind==='reassign')return `<div class="modal" style="width:min(420px,100%)" role="dialog" aria-modal="true" aria-label="变更责任人"><div class="modalhead"><div><h2>变更${state.level||'工单'}责任人</h2><div class="sub">YDBRD-60778 · 当前：${state.currentOwner||'何灿'}</div></div><button class="iconbtn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div><div class="modalbody"><div class="field"><label for="new-owner">新责任人</label>${personSelect('', 'id="new-owner"')}</div><p class="note">变更会记录原责任人、新责任人、操作者和时间。</p><div class="error" id="form-error"></div></div><div class="modalfoot"><span></span><div class="inline"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-reassign">确认变更</button></div></div></div>`;return `<div class="modal" style="width:min(460px,100%)" role="dialog" aria-modal="true" aria-label="新增文档"><div class="modalhead"><div><h2>提出新增文档</h2><div class="sub">安装部署手册</div></div><button class="iconbtn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div><div class="modalbody"><div class="field"><label for="new-section">指定章节 *</label><select id="new-section"><option value="">选择章节</option><option>安装与升级 / 部署</option><option>安装与升级 / 升级</option></select></div><div class="field"><label for="new-title">文档标题 *</label><input id="new-title" placeholder="输入文档标题"></div><div class="field"><label for="new-doc-owner">文档责任人 *</label>${personSelect('', 'id="new-doc-owner"')}</div><div class="error" id="form-error"></div></div><div class="modalfoot"><span></span><div class="inline"><button class="btn" data-action="document">返回</button><button class="btn primary" data-action="add-document">加入范围</button></div></div></div>`}
function render(){document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===state.scene));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.getElementById('main-view').innerHTML=state.tab==='flow'?flow():state.tab==='config'?'<div class="flowpage"><h2 style="font-size:16px;margin:0 0 10px">任务配置</h2><p class="muted">默认责任人：何灿 · 仅影响新导入的任务</p></div>':table();document.getElementById('drawer-host').innerHTML=state.drawer!==false?drawer():'';document.getElementById('modal-host').innerHTML=state.modal?`<div class="overlay" data-backdrop="true">${state.modal==='handbook'?handbookModal():state.modal==='document'?documentModal():smallModal(state.modal)}</div>`:'';document.getElementById('toast-host').innerHTML=state.toast?`<div class="toast">${state.toast}</div>`:'';if(window.lucide)lucide.createIcons()}
function go(scene){state.scene=scene;state.tab=scene==='flow'?'flow':'list';state.drawer=scene!=='flow';state.modal=scene==='handbook'?'handbook':scene==='document'?'document':scene==='nochange'?'handbook':null;state.scope=scene==='nochange'?'not':'involved';state.error='';state.toast='';render()}
function flash(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';render()},2700)}function error(msg){state.error=msg;const el=document.getElementById('form-error');if(el)el.textContent=msg}
document.addEventListener('click',e=>{const b=e.target.closest('[data-scene],[data-tab],[data-action]');if(!b){if(e.target.dataset.backdrop){state.modal=null;render()}return}if(b.dataset.scene){go(b.dataset.scene);return}if(b.dataset.tab){state.tab=b.dataset.tab;state.scene=b.dataset.tab==='flow'?'flow':'detail';state.modal=null;render();return}const a=b.dataset.action;if(a==='close-modal'){state.modal=null;render()}else if(a==='close-drawer'){state.drawer=false;render()}else if(a==='open-detail'){state.drawer=true;render()}else if(['handbook','document','progress'].includes(a)){go(a)}else if(a==='reassign'){state.modal='reassign';state.level=b.dataset.level;state.currentOwner=b.dataset.current;render()}else if(a==='new-document'){state.modal='new-document';render()}else if(a==='save-draft'){state.modal=null;flash('草稿已保存；尚未转交下级责任人')}else if(a==='confirm-handbook'){if(state.scope==='not'){if(!state.reason||state.reason==='other'&&!state.reasonOther.trim())return error('请填写工单不涉及的理由');state.modal=null;flash('工单不涉及已确认；平台文档任务已完成')}else{if(!state.handbooks.size)return error('请至少选择一本手册');if([...state.handbooks].some(id=>!state.handbookOwners[id]))return error('请为每本已选手册指定负责人');state.modal=null;flash(`已转交 ${state.handbooks.size} 本手册；等待负责人逐本判断`)}}else if(a==='confirm-document'){if(state.docScope==='not'){if(!state.reason||state.reason==='other'&&!state.reasonOther.trim())return error('请填写本手册不涉及的理由');state.modal=null;flash('本手册不涉及已确认；其他手册不受影响')}else{if(!state.documents.size)return error('请至少选择一篇文档');if([...state.documents].some(id=>!state.documentOwners[id]))return error('请为每篇已选文档指定负责人');state.modal=null;flash(`已分派 ${state.documents.size} 篇文档；开始处理前须确认目标版本`)}}else if(a==='confirm-reassign'){const p=document.getElementById('new-owner').value;if(!p)return error('请选择新责任人');state.modal=null;flash(`责任人已变更为${p}（示例操作）`)}else if(a==='add-document'){const section=document.getElementById('new-section').value,title=document.getElementById('new-title').value.trim(),owner=document.getElementById('new-doc-owner').value;if(!section||!title||!owner)return error('请填写章节、标题并指定责任人');const id=`new-${documents.length}`;documents.push([id,escapeHtml(title),`拟新增 · ${escapeHtml(section)}`]);state.documents.add(id);state.documentOwners[id]=owner;state.modal='document';flash('新增文档已加入范围（示例）')}});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='scope'){state.scope=t.value;state.reason='';state.error='';render()}else if(t.name==='docscope'){state.docScope=t.value;state.reason='';state.error='';render()}else if(t.id==='reason'){state.reason=t.value;render()}else if(t.dataset.handbook){t.checked?state.handbooks.add(t.dataset.handbook):state.handbooks.delete(t.dataset.handbook);render()}else if(t.dataset.document){t.checked?state.documents.add(t.dataset.document):state.documents.delete(t.dataset.document);render()}else if(t.dataset.handbookOwner){state.handbookOwners[t.dataset.handbookOwner]=t.value}else if(t.dataset.documentOwner){state.documentOwners[t.dataset.documentOwner]=t.value}});document.addEventListener('input',e=>{const t=e.target;if(t.id==='handbook-query'){state.handbookQuery=t.value;render();document.getElementById('handbook-query').focus()}else if(t.id==='document-query'){state.documentQuery=t.value;render();document.getElementById('document-query').focus()}else if(t.id==='reason-other'){state.reasonOther=t.value}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});go('detail');
</script>
</body></html>
