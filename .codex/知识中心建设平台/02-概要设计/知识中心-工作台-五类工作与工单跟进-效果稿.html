<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识中心工作台 · 五类工作与工单跟进</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;--page:#f7f8fa;--surface:#fff;--line:#e1e6ea;--ink:#26333d;--muted:#62727d;--blue:#176c9c;--blue-soft:#eaf4f9;--amber:#926221;--amber-soft:#fff5e5}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-size:13px;line-height:1.5;letter-spacing:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}[hidden]{display:none!important}
    .preview{height:28px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#303b43;color:white;font-size:11px}.preview span{opacity:.8}
    .shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 28px)}.sidebar{border-right:1px solid #dbe3e8;background:#f3f6f8;padding:13px 9px}.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 9px;border-bottom:1px solid #e1e7eb;margin-bottom:11px}.brand-mark{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;background:#e1f1f8;color:var(--blue)}.brand-mark svg{width:21px;height:21px}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#7c8a93;font-size:11px}.nav-label{padding:11px 10px 5px;color:#80919b;font-size:11px}.nav{height:39px;display:flex;align-items:center;gap:9px;padding:0 10px;color:#465c6b;border-radius:5px;font-weight:600}.nav svg{width:17px;height:17px}.nav.active{background:#dceff8;color:#11658f;box-shadow:inset 3px 0 #1680b2}
    main{min-width:0}.content{padding:23px 26px 55px;width:100%}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.head h1{margin:0;font-size:23px;line-height:1.3}.head small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.refresh{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #cbd7df;border-radius:5px;background:white;color:#405666}.refresh svg{width:15px;height:15px}
    .board{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}.board-head{padding:16px 19px 0;border-bottom:1px solid var(--line)}.title{display:flex;align-items:center;gap:9px}.title h2{font-size:16px;margin:0}.total{font-size:11px;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:4px}.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:thin}.tabs button{flex:none;height:42px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:#586c78;white-space:nowrap}.tabs button:first-child{padding-left:0}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.tabs button small{margin-left:4px;color:inherit;font-size:11px}.tabs button.pending{color:#82909a}.toolbar{min-height:59px;display:flex;align-items:end;gap:9px;padding:11px 19px;flex-wrap:wrap}.toolbar label{display:grid;gap:3px;color:#6b7b85;font-size:11px}.toolbar input,.toolbar select{height:32px;border:1px solid #cfd9df;border-radius:4px;background:white;padding:0 9px;color:#334955}.toolbar input{width:min(330px,70vw)}.toolbar .count{margin-left:auto;align-self:center;color:#6d7d87;font-size:12px}.column{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(165px,.75fr) 100px;gap:12px;padding:8px 19px;background:#fafbfc;border-top:1px solid var(--line);color:#7a8a94;font-size:11px}
    .item{border-top:1px solid var(--line)}.item-head{min-height:76px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(165px,.75fr) 100px;gap:12px;align-items:center;padding:10px 19px}.item-head:hover{background:#fbfdfe}.identity{min-width:0;display:flex;align-items:center;gap:7px}.expand{width:27px;height:30px;flex:none;border:0;border-radius:4px;background:transparent;color:#647786;display:grid;place-items:center}.expand:hover{background:#eaf4f9}.expand svg{width:16px;height:16px;transition:transform .15s}.item.open .expand svg{transform:rotate(90deg)}.item-title{min-width:0}.item-title strong{display:block;font-size:14px;overflow-wrap:anywhere}.item-title small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;width:max-content;max-width:100%;border-radius:4px;padding:2px 7px;background:var(--blue-soft);color:#28688d;font-size:11px;white-space:nowrap}.status.wait{background:var(--amber-soft);color:var(--amber)}.context{color:#4b5d69;font-size:12px;min-width:0}.context small{display:block;color:#7e8d97;font-size:11px}.primary{height:34px;border:1px solid var(--blue);border-radius:4px;background:var(--blue);color:white;padding:0 10px;white-space:nowrap}.primary:hover{background:#10567d}.secondary{height:32px;border:1px solid #cdd9e0;border-radius:4px;background:white;color:var(--blue);padding:0 9px;white-space:nowrap}.secondary:hover{background:#eef6fa}.trail{padding:4px 19px 14px 55px;background:#fbfcfd;border-top:1px solid #edf0f2}.trail-row{display:grid;grid-template-columns:100px minmax(0,1fr) minmax(150px,.55fr);gap:12px;align-items:center;min-height:36px;border-bottom:1px solid #eef1f3;color:#536572;font-size:12px}.trail-row:last-child{border-bottom:0}.trail-row span:first-child{display:flex;align-items:center;gap:6px;color:#647786}.trail-row svg{width:14px;height:14px}.trail-row strong{font-weight:600;color:#2f4350}.trail-row em{font-style:normal;color:#6a7b87}.empty{padding:38px 18px;text-align:center;border-top:1px solid var(--line)}.empty strong{display:block;font-size:14px}.empty p{margin:4px 0 0;color:var(--muted)}
    .follow{margin-top:17px;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.follow-head{padding:12px 19px;display:flex;align-items:center;justify-content:space-between;gap:12px}.follow-head h2{font-size:14px;margin:0}.follow-head span{color:var(--muted);font-size:12px}.follow .item-head{border-top:1px solid var(--line)}.follow .primary{background:white;color:var(--blue)}.follow .primary:hover{background:#eef6fa}.toast{position:fixed;right:18px;bottom:18px;z-index:3;padding:10px 13px;border-radius:5px;background:#273946;color:white;font-size:12px}.dialog{width:min(470px,calc(100vw - 20px));border:0;border-radius:8px;padding:0;box-shadow:0 16px 50px #172d3c40}.dialog::backdrop{background:#162e3b80}.dialog-head,.dialog-foot{padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-head{border-bottom:1px solid var(--line)}.dialog-head h2{font-size:16px;margin:0}.dialog-head button{border:0;background:none;color:#62717d}.dialog-head svg{width:18px;height:18px}.dialog-body{padding:16px 17px;color:#4e5d68}.dialog-body p{margin:0 0 10px}.dialog-body dl{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:0}.dialog-body dt{color:#798891}.dialog-body dd{margin:0}.dialog-foot{border-top:1px solid var(--line);justify-content:flex-end}
    @media(max-width:900px){.shell{grid-template-columns:190px minmax(0,1fr)}.content{padding:18px 14px 45px}.column,.item-head{grid-template-columns:minmax(0,1.5fr) minmax(110px,.6fr) 90px;gap:7px;padding-left:13px;padding-right:13px}}
    @media(max-width:680px){.shell{display:block}.sidebar{display:none}.content{padding:16px 10px 36px}.head h1{font-size:20px}.board-head{padding:12px 11px 0}.toolbar{padding:10px 11px}.toolbar label:first-child{width:100%}.toolbar input{width:100%}.toolbar .count{width:100%;margin-left:0}.column{display:none}.item-head{grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:11px}.identity{grid-column:1/-1}.context{grid-column:1;padding-left:34px}.item-head .primary{grid-column:2;grid-row:2;min-height:44px}.trail{padding:4px 10px 10px 35px}.trail-row{grid-template-columns:64px minmax(0,1fr);gap:4px}.trail-row em{grid-column:2}.follow-head{padding:11px}.tabs button{padding:0 9px}}
  </style>
</head>
<body>
  <div class="preview"><strong>个人工作台 · 交互效果稿</strong><span>示例数据</span></div>
  <div class="shell">
    <aside class="sidebar" aria-label="平台导航">
      <div class="brand"><span class="brand-mark"><i data-lucide="cloud"></i></span><div><strong>知识中心管理</strong><small>YashanDB</small></div></div>
      <div class="nav-label">工作区</div>
      <div class="nav active"><i data-lucide="layout-dashboard"></i>工作台</div>
      <div class="nav"><i data-lucide="library"></i>知识资产</div>
      <div class="nav"><i data-lucide="list-tree"></i>大纲管理</div>
      <div class="nav"><i data-lucide="files"></i>模板管理</div>
      <div class="nav"><i data-lucide="workflow"></i>文档生产</div>
      <div class="nav"><i data-lucide="list-checks"></i>任务管理</div>
      <div class="nav"><i data-lucide="badge-check"></i>审核与发布</div>
      <div class="nav-label">治理</div><div class="nav"><i data-lucide="settings"></i>平台管理</div>
    </aside>
    <main><div class="content">
      <header class="head"><div><h1>待我处理</h1><small>何阳 · 个人工作台</small></div><button class="refresh" id="refresh" type="button"><i data-lucide="refresh-cw"></i>刷新</button></header>
      <section class="board" aria-label="待我处理的工作">
        <div class="board-head"><div class="title"><h2>我的工作</h2><span class="total">已接入待办 2</span></div><nav class="tabs" aria-label="工作类型">
          <button class="active" data-kind="all" aria-current="true">全部 <small>2</small></button><button data-kind="assign" aria-current="false">分派 <small>0</small></button><button data-kind="write" aria-current="false">写文档 <small>2</small></button><button data-kind="review" aria-current="false">审核发布 <small>0</small></button><button class="pending" data-kind="outline" aria-current="false">大纲 <small>待接入</small></button><button class="pending" data-kind="template" aria-current="false">模板 <small>待接入</small></button>
        </nav></div>
        <div class="toolbar"><label>搜索<input id="search" type="search" placeholder="文档、手册或工单编号"></label><label>目标分支<select id="branch"><option value="">全部分支</option><option value="master">master</option></select></label><span class="count" id="count" role="status">2 项待办</span></div>
        <div class="column"><span>当前工作 / 来源</span><span>状态 / 目标分支</span><span>操作</span></div><div id="tasks"></div><div class="empty" id="empty" hidden><strong id="empty-title">当前没有这类待办</strong><p id="empty-note"></p></div>
      </section>
      <section class="follow" aria-label="跟进中的工单"><div class="follow-head"><h2>跟进中 <span>1</span></h2><span>等待他人处理，工单仍可查看</span></div><div id="following"></div></section>
    </div></main>
  </div>
  <dialog class="dialog" id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" type="button" aria-label="关闭详情"><i data-lucide="x"></i></button></div><div class="dialog-body"><p id="detail-summary"></p><dl><dt>工单</dt><dd id="detail-ticket"></dd><dt>手册</dt><dd id="detail-book"></dd><dt>当前阶段</dt><dd id="detail-stage"></dd></dl></div><div class="dialog-foot"><button class="secondary" id="back" type="button">返回</button><button class="primary" id="source" type="button">打开来源页面</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="../../../apps/knowledge-center-web/frontend/knowledge-center/common/vendor/lucide.min.js"></script>
  <script>
    const tasks=[
      {id:'write-1',kind:'write',title:'编写「数值型」',ticket:'YDBRD-42617',book:'SQL 参考手册',branch:'master',stage:'待处理',summary:'工单 YDBRD-42617 下的文档编写任务',source:'文档生产'},
      {id:'write-2',kind:'write',title:'编写「字面量」',ticket:'YDBRD-42618',book:'SQL 参考手册',branch:'master',stage:'待处理',summary:'工单 YDBRD-42618 下的文档编写任务',source:'文档生产'}
    ];
    const following={id:'follow-1',title:'工作台验收文档任务',ticket:'E2E-WB-20261104-HE-YANG',book:'DB-054',branch:'master',stage:'交付中',summary:'审核已通过，等待 MR 人工合并及正文、图片回读',source:'任务管理'};
    const expanded=new Set(['follow-1']);let selected='all';let current=null;const $=id=>document.getElementById(id);
    const trail=item=>`<div class="trail"><div class="trail-row"><span><i data-lucide="ticket"></i>工单</span><strong>${item.ticket}</strong><em>来源任务</em></div><div class="trail-row"><span><i data-lucide="book-open"></i>手册</span><strong>${item.book}</strong><em>目标分支 ${item.branch}</em></div><div class="trail-row"><span><i data-lucide="file-text"></i>文档</span><strong>${item.id==='follow-1'?'工作台验收说明':item.title.replace('编写「','').replace('」','')}</strong><em>${item.id==='follow-1'?'审核通过 · MR !458 等待合并回读':'文档负责人 何阳'}</em></div></div>`;
    function row(item,follow=false){const open=expanded.has(item.id);return `<article class="item ${open?'open':''}"><div class="item-head"><div class="identity"><button class="expand" type="button" data-expand="${item.id}" aria-expanded="${open}" aria-label="${open?'收起':'展开'}${item.ticket}关联信息"><i data-lucide="chevron-right"></i></button><div class="item-title"><strong>${item.title}</strong><small>${item.ticket} · ${item.book}</small></div></div><div class="context"><span class="status ${follow?'wait':''}">${item.stage}</span><small>目标分支 ${item.branch}</small></div><button class="${follow?'secondary':'primary'}" type="button" data-open="${item.id}">${follow?'查看进展':'去编写'}</button></div>${open?trail(item):''}</article>`}
    function render(){const q=$('search').value.trim().toLowerCase(),branch=$('branch').value;const list=tasks.filter(t=>(selected==='all'||selected===t.kind)&&(!q||`${t.title} ${t.ticket} ${t.book}`.toLowerCase().includes(q))&&(!branch||branch===t.branch));$('tasks').innerHTML=list.map(t=>row(t)).join('');$('count').textContent=`${list.length} 项待办`;$('empty').hidden=!!list.length;$('empty-title').textContent=['outline','template'].includes(selected)?'个人待办尚待接入':'当前没有这类待办';$('empty-note').textContent=['outline','template'].includes(selected)?'该类别尚无可靠的个人任务来源。':'调整筛选条件，或查看其他工作类型。';$('following').innerHTML=row(following,true);window.lucide?.createIcons()}
    function toast(message){const node=$('toast');node.textContent=message;node.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.hidden=true,2600)}
    document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(tab=>{tab.classList.toggle('active',tab===button);tab.setAttribute('aria-current',String(tab===button))});render()}));
    $('search').addEventListener('input',render);$('branch').addEventListener('change',render);$('refresh').addEventListener('click',()=>{render();toast('已刷新示例数据')});
    document.addEventListener('click',event=>{const expand=event.target.closest('[data-expand]');if(expand){expanded.has(expand.dataset.expand)?expanded.delete(expand.dataset.expand):expanded.add(expand.dataset.expand);render();document.querySelector(`[data-expand="${expand.dataset.expand}"]`)?.focus();return}const open=event.target.closest('[data-open]');if(!open)return;current=[...tasks,following].find(t=>t.id===open.dataset.open);$('detail-title').textContent=current.title;$('detail-summary').textContent=current.summary;$('detail-ticket').textContent=current.ticket;$('detail-book').textContent=current.book;$('detail-stage').textContent=current.stage;$('detail').showModal()});
    $('close').addEventListener('click',()=>$('detail').close());$('back').addEventListener('click',()=>$('detail').close());$('source').addEventListener('click',()=>{$('detail').close();toast(`效果稿：进入${current.source}`)});render();
  </script>
</body>
</html>
