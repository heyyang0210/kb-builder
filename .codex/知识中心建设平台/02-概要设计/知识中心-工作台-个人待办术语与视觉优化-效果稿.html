<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识中心工作台 · 待我处理</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;--ink:#21313d;--muted:#637582;--line:#dfe7eb;--soft:#f5f8fa;--blue:#176c9c;--blue-soft:#eaf4f9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-size:13px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1476ad;outline-offset:2px}.demo{height:31px;background:#263740;color:#eaf2f6;display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-size:11px}.demo button{color:#eaf2f6;background:none;border:0;text-decoration:underline}.shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:calc(100vh - 31px)}aside{background:#fbfcfd;border-right:1px solid var(--line);padding:14px 10px}.brand{display:flex;align-items:center;gap:10px;height:48px;padding:0 11px;color:#284b60;font-size:15px;font-weight:700}.logo{display:grid;place-items:center;width:27px;height:27px;border:1px solid #c0d6df;border-radius:5px;background:#e9f4f8;color:#126b98}.navlabel{padding:20px 11px 6px;color:#8a99a2;font-size:11px}.nav{height:36px;display:flex;align-items:center;padding:0 11px;color:#50636d;border-radius:4px}.nav.active{color:#075f8a;background:#e1f1f8;border-left:3px solid #1476a9;padding-left:8px;font-weight:700}.main{min-width:0}.topbar{height:47px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 27px;color:#72818b;font-size:12px}.avatar{width:25px;height:25px;display:inline-grid;place-items:center;background:#e0edf2;border-radius:50%;color:#31586b;margin-right:7px}.content{max-width:1290px;margin:0 auto;padding:28px 32px 70px}.headline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:21px}.titleline{display:flex;align-items:center;gap:11px}.titleline h1{font-size:25px;line-height:1.3;letter-spacing:-.025em;margin:0}.total{font-size:12px;font-weight:600;color:#176c9c;background:#e8f3f8;border-radius:12px;padding:3px 9px;white-space:nowrap}.subtitle{margin:4px 0 0;color:var(--muted)}.refresh{height:33px;padding:0 12px;border:1px solid #cbd7dd;border-radius:5px;background:white;color:#405763}.refresh:hover,.rowaction:hover{background:#f1f7fa}.notice{background:#fff8ef;border:1px solid #f2dcba;border-left:3px solid #b5822e;color:#704d1c;border-radius:4px;padding:9px 12px;margin-bottom:15px}.notice[hidden]{display:none}.board{background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px #17394b08;overflow:hidden}.boardhead{padding:17px 20px 0;border-bottom:1px solid var(--line)}.boardhead h2{font-size:16px;margin:0 0 3px}.boardhead p{color:var(--muted);font-size:12px}.tabs{display:flex;align-items:center;gap:4px;margin-top:15px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}.tabs button{display:inline-flex;align-items:center;gap:6px;flex:none;border:0;border-bottom:2px solid transparent;background:none;padding:9px 13px 10px;color:#5f717c}.tabs button:first-child{padding-left:0}.tabs button.active{border-color:var(--blue);color:#0c6796;font-weight:700}.tabs button[disabled]{color:#a2adb4;cursor:not-allowed}.tabs small{font-size:11px;font-weight:500;color:inherit}.toolbar{padding:14px 20px 12px;display:flex;align-items:end;gap:10px;flex-wrap:wrap}.field{display:grid;gap:5px;color:#566a76;font-size:11px}.field input,.field select{height:34px;border:1px solid #cbd8de;border-radius:5px;background:#fff;padding:0 10px;color:#344955}.field input{width:min(335px,70vw)}.field select{min-width:120px}.result{margin-left:auto;color:#637582;align-self:center;padding-top:17px;font-size:12px}.body{padding-bottom:6px}.group{border-top:1px solid var(--line)}.grouphead{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 7px;color:#314c5b}.grouphead h3{font-size:13px;margin:0}.grouphead span{font-size:11px;color:#81909a}.item{min-height:72px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:17px;align-items:center;padding:10px 20px 10px 26px;border-top:1px solid #f0f3f5}.item:hover{background:#fbfdfe}.itemmain{min-width:0}.actiontitle{font-size:14px;font-weight:650;line-height:1.45;color:#263c48}.context{color:#6b7d87;font-size:11px;margin-top:3px;overflow-wrap:anywhere}.context span+span:before{content:"·";padding:0 7px;color:#a9b7be}.status{font-size:11px;border-radius:4px;padding:3px 7px;white-space:nowrap;background:#ecf4f8;color:#236688}.status.pending{background:#fff4e3;color:#89631f}.status.risk{background:#fbece9;color:#a53f37}.rowaction{height:31px;border:1px solid #cbd8de;border-radius:4px;background:white;color:#176c9c;padding:0 10px;white-space:nowrap}.empty{padding:46px 18px;text-align:center;border-top:1px solid var(--line)}.empty b{font-size:15px}.empty p{margin:6px 0 14px;color:var(--muted)}.empty button{height:32px;padding:0 11px;border:1px solid #bed5e2;border-radius:4px;color:var(--blue);background:#fff}.empty[hidden]{display:none}.boardfoot{padding:10px 20px;color:#81909a;border-top:1px solid var(--line);font-size:11px}.dialog{border:0;border-radius:9px;padding:0;width:min(470px,calc(100vw - 20px));max-height:90vh;box-shadow:0 18px 60px #15334438}.dialog::backdrop{background:#18344280}.dialoghead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.dialoghead h2{margin:0;font-size:18px}.dialoghead button{border:0;background:none;color:#647783;font-size:19px;line-height:1}.dialogbody{padding:18px 20px}.dialogbody dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:12px 10px}.dialogbody dt{color:#7b8a93}.dialogbody dd{margin:0}.dialogfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.dialogfoot button{height:33px;padding:0 11px;border:1px solid #cbd8de;border-radius:4px;background:#fff}.dialogfoot button.primary{background:#176c9c;border-color:#176c9c;color:white}@media(max-width:850px){.shell{grid-template-columns:175px minmax(0,1fr)}.content{padding:20px 18px}.tabs button{padding-left:10px;padding-right:10px}}@media(max-width:650px){.shell{display:block}aside{display:none}.topbar{padding:0 13px}.content{padding:18px 11px}.titleline h1{font-size:21px}.headline{margin-bottom:15px}.boardhead{padding:14px 12px 0}.toolbar{padding:12px;gap:8px}.field.search{width:100%}.field input{width:100%}.field select{min-width:0}.result{width:100%;padding-top:0;margin-left:0}.grouphead{padding-left:12px;padding-right:12px}.item{padding:10px 12px;grid-template-columns:minmax(0,1fr) auto;gap:7px}.itemmain{grid-column:1/-1}.status{grid-column:1;justify-self:start}.rowaction{grid-column:2}.boardfoot{padding:10px 12px}}
</style></head><body>
<div class="demo"><strong>个人工作台 · 设计效果稿</strong><button id="scenario" type="button" aria-pressed="false">演示来源不可用</button></div>
<div class="shell"><aside><div class="brand"><span class="logo">知</span>知识中心管理</div><div class="navlabel">工作区</div><div class="nav active">工作台</div><div class="nav">知识资产</div><div class="nav">大纲管理</div><div class="nav">模板管理</div><div class="nav">文档生产</div><div class="nav">任务管理</div><div class="nav">审核与发布</div><div class="navlabel">治理</div><div class="nav">平台管理</div></aside>
<main class="main"><div class="topbar"><span>知识中心 / 工作台</span><span><span class="avatar">陈</span>陈工</span></div><div class="content"><header class="headline"><div><div class="titleline"><h1>待我处理</h1><span class="total" id="total">15项</span></div><p class="subtitle">从这里找到需要你处理的工作</p></div><button class="refresh" id="refresh">刷新</button></header>
<div class="notice" id="partial" role="status" hidden>部分数据：审核与发布暂不可用。当前只显示已读取来源的事项。</div>
<section class="board" aria-label="我的工作"><div class="boardhead"><h2 id="category-title">我的工作</h2><p id="category-desc">分派、写作、审核、大纲和模板，按工作类型查看。</p><nav class="tabs" aria-label="工作类型"><button class="active" data-kind="all">全部 <small></small></button><button data-kind="assign">分派 <small></small></button><button data-kind="document">写文档 <small></small></button><button data-kind="review">审核发布 <small></small></button><button data-kind="outline">大纲 <small></small></button><button data-kind="template">模板 <small></small></button></nav></div>
<div class="toolbar"><label class="field search">搜索<input id="query" type="search" placeholder="输入编号或名称"></label><label class="field">业务版本<select id="version"><option value="">全部版本</option><option value="23.4">23.4</option><option value="23.3">23.3</option></select></label><label class="field">状态<select id="status"><option value="">全部状态</option><option value="pending">待处理</option><option value="active">处理中</option><option value="risk">需修订</option></select></label><span class="result" id="result" role="status" aria-live="polite"></span></div><div class="body" id="list"></div><div class="empty" id="empty" hidden><b id="empty-title">没有符合条件的工作</b><p id="empty-note">可以调整搜索词或筛选条件。</p><button id="clear">清除筛选</button></div></section></div></main></div>
<dialog class="dialog" id="detail"><div class="dialoghead"><h2 id="detail-title"></h2><button type="button" id="close" aria-label="关闭详情">×</button></div><div class="dialogbody"><dl><dt>所属工作</dt><dd id="detail-category"></dd><dt>来源</dt><dd id="detail-source"></dd><dt>关联信息</dt><dd id="detail-context"></dd><dt>当前状态</dt><dd id="detail-status"></dd></dl></div><div class="dialogfoot"><button id="back">返回</button><button class="primary" id="open-source">打开处理页面</button></div></dialog>
<script>
const types={assign:{short:'分派',full:'分派任务',desc:'待你判断范围或指派责任人的工作'},document:{short:'写文档',full:'文档编写',desc:'待你编写或修订的文档'},review:{short:'审核发布',full:'文档审核与发布',desc:'待你审核或处理交付的事项'},outline:{short:'大纲',full:'大纲创建、更新和维护',desc:'待你创建或维护的大纲'},template:{short:'模板',full:'模板创建、更新和维护',desc:'待你创建或维护的模板'}};
const items=[
{id:'A-1',kind:'assign',title:'确认客户手册涉及哪些文档',context:'YDBRD-42618 · 客户手册',source:'任务管理',version:'23.4',status:'待处理',state:'pending'},
{id:'A-2',kind:'assign',title:'分派 SQL 参考手册的文档负责人',context:'YDBRD-42590 · SQL 参考手册',source:'任务管理',version:'23.4',status:'处理中',state:'active'},
{id:'A-3',kind:'assign',title:'确认网络手册的文档范围',context:'YDBRD-42442 · 网络手册',source:'任务管理',version:'23.3',status:'待处理',state:'pending'},
{id:'A-4',kind:'assign',title:'分派 DB-TOOLS 领域页面责任人',context:'DB-TOOLS · 领域任务',source:'大纲管理',version:'',status:'处理中',state:'active'},
{id:'D-1',kind:'document',title:'修订外部资料连接配置说明',context:'YDBRD-42618 · 客户手册 · 文档 D-8841',source:'文档生产',version:'23.4',status:'编写中',state:'active'},
{id:'D-2',kind:'document',title:'编写主备切换操作步骤',context:'YDBRD-42572 · 运维手册 · 文档 D-8827',source:'文档生产',version:'23.4',status:'待处理',state:'pending'},
{id:'D-3',kind:'document',title:'按审核意见修订账户锁定策略',context:'YDBRD-42380 · 安全手册 · 文档 D-8799',source:'文档生产',version:'23.3',status:'需修订',state:'risk'},
{id:'D-4',kind:'document',title:'补充客户端驱动版本矩阵',context:'YDBRD-42290 · 兼容性手册 · 文档 D-8791',source:'文档生产',version:'23.4',status:'待处理',state:'pending'},
{id:'R-1',kind:'review',title:'审核数据字典与字段说明',context:'YDBRD-42590 · 审核任务 R-402',source:'审核与发布',version:'23.4',status:'待审核',state:'pending'},
{id:'R-2',kind:'review',title:'处理安全基线章节的已关闭 MR',context:'YDBRD-42520 · 交付事项 P-114',source:'审核与发布',version:'23.4',status:'待处理',state:'pending'},
{id:'R-3',kind:'review',title:'检查网络手册章节发布状态',context:'YDBRD-42410 · 发布事项 P-109',source:'审核与发布',version:'23.3',status:'处理中',state:'active'},
{id:'O-1',kind:'outline',title:'创建客户手册大纲',context:'客户手册 · 大纲任务 O-201',source:'大纲管理',version:'23.4',status:'待处理',state:'pending'},
{id:'O-2',kind:'outline',title:'确认网络手册目录变更',context:'网络手册 · 大纲任务 O-202',source:'大纲管理',version:'23.3',status:'处理中',state:'active'},
{id:'T-1',kind:'template',title:'创建安装步骤模板',context:'模板任务 T-301 · 安装部署',source:'模板管理',version:'',status:'待处理',state:'pending'},
{id:'T-2',kind:'template',title:'更新故障排查模板',context:'模板任务 T-302 · 排查步骤',source:'模板管理',version:'',status:'处理中',state:'active'}
];
let selected='all',partial=false,current=null;const $=selector=>document.querySelector(selector);const $$=selector=>[...document.querySelectorAll(selector)];
function available(){return items.filter(item=>!(partial&&item.kind==='review'))}
function render(){
 const all=available(),q=$('#query').value.trim().toLowerCase(),version=$('#version').value,status=$('#status').value;
 const filtered=all.filter(item=>(selected==='all'||item.kind===selected)&&(!q||[item.title,item.context,item.source].join(' ').toLowerCase().includes(q))&&(!version||item.version===version)&&(!status||item.state===status));
 $('#total').textContent=partial?`已读取${all.length}项 · 部分数据`:`${all.length}项`;
 $('#partial').hidden=!partial;
 $$('.tabs button').forEach(button=>{const kind=button.dataset.kind,count=kind==='all'?all.length:all.filter(item=>item.kind===kind).length;button.querySelector('small').textContent=partial&&kind==='review'?'暂不可用':count;button.disabled=partial&&kind==='review';button.classList.toggle('active',selected===kind);button.setAttribute('aria-label',kind==='all'?`全部工作，${count}项`:`${types[kind].full}，${partial&&kind==='review'?'来源暂不可用':count+'项'}`)});
 $('#category-title').textContent=selected==='all'?'我的工作':types[selected].full;
 $('#category-desc').textContent=selected==='all'?'分派、写作、审核、大纲和模板，按工作类型查看。':types[selected].desc;
 $('#result').textContent=q||version||status?`符合筛选 ${filtered.length} 项`:`${filtered.length} 项`;
 const groups=selected==='all'?Object.keys(types):[selected];
 $('#list').innerHTML=groups.map(kind=>{const rows=filtered.filter(item=>item.kind===kind);if(!rows.length)return '';return `<section class="group">${selected==='all'?`<header class="grouphead"><h3>${types[kind].full}</h3><span>${rows.length}项</span></header>`:''}${rows.map(item=>`<article class="item"><div class="itemmain"><div class="actiontitle">${item.title}</div><div class="context"><span>${item.context}</span><span>${item.source}</span>${item.version?`<span>业务版本 ${item.version}</span>`:''}</div></div><span class="status ${item.state}">${item.status}</span><button class="rowaction" data-open="${item.id}" aria-label="查看${item.title}">查看任务</button></article>`).join('')}</section>`}).join('');
 $('#empty').hidden=filtered.length>0;
 const hasFilter=!!(q||version||status);
 $('#empty-title').textContent=hasFilter?'没有符合筛选条件的工作':'当前没有需要你处理的工作';
 $('#empty-note').textContent=hasFilter?'可以调整搜索词或筛选条件。':'有新的个人事项时会出现在这里。';
 $('#clear').hidden=!hasFilter;
}
$$('.tabs button').forEach(button=>button.addEventListener('click',()=>{if(button.disabled)return;selected=button.dataset.kind;render()}));
['query','version','status'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#clear').addEventListener('click',()=>{$('#query').value='';$('#version').value='';$('#status').value='';render();$('#query').focus()});
$('#refresh').addEventListener('click',render);
$('#scenario').addEventListener('click',event=>{partial=!partial;if(partial&&selected==='review')selected='all';event.currentTarget.textContent=partial?'恢复完整来源':'演示来源不可用';event.currentTarget.setAttribute('aria-pressed',String(partial));render()});
$('#list').addEventListener('click',event=>{const button=event.target.closest('[data-open]');if(!button)return;current=items.find(item=>item.id===button.dataset.open);$('#detail-title').textContent=current.title;$('#detail-category').textContent=types[current.kind].full;$('#detail-source').textContent=current.source;$('#detail-context').textContent=current.context+(current.version?` · 业务版本 ${current.version}`:'');$('#detail-status').textContent=current.status;$('#detail').showModal()});
$('#close').addEventListener('click',()=>$('#detail').close());$('#back').addEventListener('click',()=>$('#detail').close());$('#open-source').addEventListener('click',()=>{$('#detail').close();alert(`效果稿：此处进入${current.source}处理页面`)});render();
</script></body></html>
