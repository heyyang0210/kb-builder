<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识中心工作台 · 当前责任人切换效果稿</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#26343d;background:#f5f7f8;--line:#dfe6e9;--muted:#63727b;--blue:#335c98;--blue-soft:#eaf0f8;--surface:#fff}
*{box-sizing:border-box}body{margin:0;font-size:13px;line-height:1.5}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #1476ad;outline-offset:2px}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:#fbfcfd;border-right:1px solid var(--line);padding:14px 10px}.brand{display:flex;align-items:center;gap:10px;height:50px;padding:0 11px;font-size:15px;font-weight:700;color:#284b60}.logo{display:grid;place-items:center;width:28px;height:28px;border:1px solid #c0d6df;border-radius:5px;background:#e9f4f8;color:#126b98}.nav-label{padding:18px 11px 5px;color:#88969e;font-size:11px}.nav{height:37px;display:flex;align-items:center;padding:0 11px;border-radius:4px;color:#50636d}.nav.active{padding-left:8px;border-left:3px solid #1476a9;background:#e1f1f8;color:#075f8a;font-weight:700}.main{min-width:0}.topbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 27px;border-bottom:1px solid var(--line);background:var(--surface);color:#72818b;font-size:12px}.account{display:flex;align-items:center;gap:8px;color:#3e5360}.avatar{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e0edf2;color:#31586b}.content{max-width:1350px;margin:0 auto;padding:24px 28px 64px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.heading h1{margin:0;font-size:24px;line-height:1.35}.heading-actions{display:flex;align-items:end;gap:12px}.responsible{display:grid;gap:5px;color:var(--muted);font-size:11px}.responsible select{height:38px;min-width:218px;max-width:280px;padding:0 10px;border:1px solid #cbd5da;border-radius:5px;background:var(--surface);color:#26343d;font-size:13px}.refresh{height:38px;padding:0 13px;border:1px solid #cbd5da;border-radius:5px;background:var(--surface);color:#405763}.refresh:hover{background:#f1f7fa}.preview{display:none;align-items:center;gap:8px;margin:0 0 16px;padding:9px 12px;border:1px solid #d4e0e6;border-left:3px solid #477b91;border-radius:4px;background:#f0f6f8;color:#315667}.preview.show{display:flex}.preview strong{font-weight:700}.preview span{color:#536974}
.summary{display:flex;align-items:center;gap:24px;min-height:76px;margin-bottom:20px;padding:14px 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.summary>div{display:flex;align-items:baseline;gap:7px}.summary>div:first-child{display:grid;gap:2px;padding-right:24px;border-right:1px solid var(--line)}.summary strong{font-size:19px}.summary>div:first-child strong{font-size:24px}.summary span{color:var(--muted);font-size:12px}.board,.following{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.board-head{padding:16px 20px 0;border-bottom:1px solid var(--line)}.board-head h2,.following h2{margin:0;font-size:16px}.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;white-space:nowrap}.tabs button{flex:none;padding:10px 13px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted)}.tabs button.active{border-color:var(--blue);color:var(--blue);font-weight:700}.tabs small{margin-left:4px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:10px;padding:13px 20px}.toolbar label{display:grid;gap:5px;color:var(--muted);font-size:11px}.toolbar input,.toolbar select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:#26343d;font-size:13px}.toolbar input{width:min(300px,70vw)}.toolbar>span{margin-left:auto;align-self:center;color:var(--muted);font-size:12px}.group{border-top:1px solid var(--line)}.group h3{margin:0;padding:11px 20px 7px;font-size:13px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;min-height:70px;padding:10px 20px 10px 26px;border-top:1px solid #f0f3f5}.row:hover{background:#fbfdfe}.row-main{min-width:0}.row-main strong{font-size:14px}.row-main p{margin:3px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.state{padding:3px 7px;border-radius:4px;background:#ecf4f8;color:#236688;font-size:11px;white-space:nowrap}.state.warn{background:#fff4e3;color:#89631f}.row-actions{display:flex;gap:8px}.row-actions button{min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:#26343d}.row-actions .primary{border-color:var(--blue);background:var(--blue);color:#fff}.row-actions .primary:disabled{border-color:#d9e1e5;background:#eef1f3;color:#6d7a82;cursor:default}.following{margin-top:16px;padding:12px 20px}.following p{margin:8px 0 0;color:var(--muted)}.empty{padding:36px 18px;text-align:center;color:var(--muted)}
@media(max-width:800px){.shell{grid-template-columns:176px minmax(0,1fr)}.content{padding:18px}.heading{align-items:flex-start;flex-wrap:wrap}.heading-actions{margin-left:auto}}
@media(max-width:650px){.shell{display:block}.sidebar{display:none}.topbar{padding:0 13px}.content{padding:18px 10px 45px}.heading{display:block}.heading h1{font-size:21px}.heading-actions{display:flex;margin-top:14px}.responsible{flex:1}.responsible select{width:100%;min-width:0}.summary{flex-wrap:wrap;gap:8px 16px;padding:12px}.summary>div:first-child{width:100%;padding:0 0 8px;border-right:0;border-bottom:1px solid var(--line)}.board-head{padding:14px 12px 0}.toolbar{padding:12px}.toolbar label:first-child{width:100%}.toolbar input{width:100%}.toolbar>span{width:100%;margin-left:0}.group h3{padding-left:12px}.row{grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:10px 12px}.row-main{grid-column:1/-1}.state{justify-self:start}.row-actions{grid-column:2}.row-actions button{min-height:44px}.following{padding:12px}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">知</span>知识中心管理</div><div class="nav-label">工作区</div><div class="nav active">工作台</div><div class="nav">知识资产</div><div class="nav">大纲管理</div><div class="nav">模板管理</div><div class="nav">文档生产</div><div class="nav">任务管理</div><div class="nav">审核与发布</div><div class="nav-label">治理</div><div class="nav">平台管理</div></aside>
<main class="main"><header class="topbar"><span>知识中心 / 工作台</span><span class="account"><span class="avatar">何</span>何阳</span></header><div class="content">
<header class="heading"><h1>我的工作</h1><div class="heading-actions"><label class="responsible">当前责任人<select id="responsible" aria-label="当前责任人"><option value="me">何阳（当前登录）</option><option value="manual">陈工 · 手册负责人</option><option value="writer">李工 · 文档撰写人</option><option value="reviewer">王工 · 文档审核人</option><option value="merge">赵工 · GitLab 合入负责人</option></select></label><button class="refresh" id="refresh" type="button">刷新</button></div></header>
<div class="preview" id="preview" role="status"><strong>本地预览 · 只读</strong><span id="preview-name"></span></div>
<div class="summary" aria-label="工作统计"><div><strong id="total">0 项</strong><span>工作总量</span></div><div><strong id="pending-count">0</strong><span>待处理</span></div><div><strong id="following-count">0</strong><span>跟进中</span></div></div>
<section class="board" aria-label="待处理工作"><div class="board-head"><h2>待我处理</h2><nav class="tabs" aria-label="待办类别"><button class="active" data-kind="all">待处理 <small id="all-count">0</small></button><button data-kind="assign">分派 <small id="assign-count">0</small></button><button data-kind="document">写文档 <small id="document-count">0</small></button><button data-kind="review">审核发布 <small id="review-count">0</small></button><button data-kind="merge">合入 <small id="merge-count">0</small></button></nav></div><div class="toolbar"><label>搜索<input id="query" type="search" placeholder="输入编号或名称"></label><label>版本或分支<select id="version"><option value="">全部版本</option><option>23.4.3alpha</option></select></label><label>状态<select id="status"><option value="">全部状态</option><option value="pending">待处理</option><option value="risk">需修订</option></select></label><span id="result" role="status"></span></div><div id="list"></div></section>
<section class="following"><h2>跟进中 <span id="following-title-count">0</span></h2><p id="following-copy"></p></section>
</div></main></div>
<script>
const people={
 me:{name:'何阳',following:'工单 YDBRD-42618 · SQL 参考手册：逐篇审核中',items:[{kind:'assign',title:'确认 SQL 参考手册的文档范围',context:'YDBRD-42618 · SQL 参考手册',status:'待处理',state:'pending',action:'确认文档范围'},{kind:'review',title:'审核 SQL 语法说明',context:'YDBRD-42590 · SQL 参考手册',status:'待审核',state:'pending',action:'开始审核'},{kind:'merge',title:'SQL 参考手册交付 MR !73',context:'YDBRD-42410 · SQL 参考手册',status:'待在 GitLab 合入',state:'pending',action:'前往 GitLab 合入'}]},
 manual:{name:'陈工',following:'工单 YDBRD-42618 · SQL 参考手册：2 篇编写中',items:[{kind:'assign',title:'确认 SQL 参考手册的文档范围',context:'YDBRD-42618 · SQL 参考手册',status:'待处理',state:'pending',action:'确认文档范围'},{kind:'assign',title:'分派运维手册的文档撰写人',context:'YDBRD-42560 · 运维手册',status:'待处理',state:'pending',action:'分派撰写人'}]},
 writer:{name:'李工',following:'工单 YDBRD-42618 · SQL 参考手册：1 篇审核中',items:[{kind:'document',title:'编写 SQL 数据类型说明',context:'YDBRD-42618 · SQL 参考手册 · 23.4.3alpha',status:'待处理',state:'pending',action:'进入文档编写'},{kind:'document',title:'修订 SQL 函数示例',context:'YDBRD-42590 · SQL 参考手册 · 23.4.3alpha',status:'需修订',state:'risk',action:'修订文档'}]},
 reviewer:{name:'王工',following:'审核任务 R-402 · SQL 参考手册：另 1 篇待其他审核人',items:[{kind:'review',title:'审核 SQL 数据类型说明',context:'YDBRD-42618 · SQL 参考手册 · 23.4.3alpha',status:'待审核',state:'pending',action:'开始审核'},{kind:'review',title:'审核 SQL 语法说明',context:'YDBRD-42590 · SQL 参考手册 · 23.4.3alpha',status:'待审核',state:'pending',action:'开始审核'}]},
 merge:{name:'赵工',following:'MR !72 · 等待任务提交人刷新交付状态',items:[{kind:'merge',title:'SQL 参考手册交付 MR !73',context:'YDBRD-42410 · SQL 参考手册 · 23.4.3alpha',status:'待在 GitLab 合入',state:'pending',action:'前往 GitLab 合入'}]}
};
let kind='all';const $=selector=>document.querySelector(selector);const $$=selector=>[...document.querySelectorAll(selector)];
function render(){const key=$('#responsible').value,person=people[key],preview=key!=='me',query=$('#query').value.trim().toLowerCase(),status=$('#status').value,version=$('#version').value;$('#preview').classList.toggle('show',preview);$('#preview-name').textContent=preview?`正在查看 ${person.name} 的工作；操作仍以何阳的登录权限为准。`:'';const rows=person.items.filter(item=>(kind==='all'||item.kind===kind)&&(!query||`${item.title} ${item.context}`.toLowerCase().includes(query))&&(!status||item.state===status)&&(!version||item.context.includes(version)));$('#total').textContent=`${person.items.length+1} 项`;$('#pending-count').textContent=person.items.length;$('#following-count').textContent='1';$('#following-title-count').textContent='1';$('#following-copy').textContent=person.following;$('#result').textContent=`${rows.length} 项待处理`;$('#all-count').textContent=person.items.length;for(const type of ['assign','document','review','merge'])$(`#${type}-count`).textContent=person.items.filter(item=>item.kind===type).length;$('#list').innerHTML=rows.length?rows.map(item=>`<article class="row"><div class="row-main"><strong>${item.title}</strong><p>${item.context}</p></div><span class="state ${item.state==='risk'?'warn':''}">${item.status}</span><div class="row-actions"><button type="button" class="detail" aria-label="查看${item.title}详情">详情</button><button type="button" class="primary" ${preview?'disabled title="本地预览只读"':''}>${item.action}</button></div></article>`).join(''):'<div class="empty">当前筛选下没有待处理事项</div>'}
$('#responsible').addEventListener('change',()=>{kind='all';$('#query').value='';$('#version').value='';$('#status').value='';$$('.tabs button').forEach(button=>button.classList.toggle('active',button.dataset.kind==='all'));render()});$$('.tabs button').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;$$('.tabs button').forEach(item=>item.classList.toggle('active',item===button));render()}));for(const id of ['query','version','status'])$('#'+id).addEventListener('input',render);$('#refresh').addEventListener('click',render);$('#list').addEventListener('click',event=>{if(event.target.matches('.detail'))alert('效果稿：此处查看当前事项详情。')});render();
</script>
</body>
</html>
