<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台联合查询与阶段列表效果稿</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#24313b;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.nav{padding:24px 14px;border-right:1px solid #dce3e8;background:#f8fafb}.brand{font-size:17px;font-weight:700;margin-bottom:28px}.nav-item{padding:9px 12px;border-radius:5px}.nav-item.active{background:#d6effb;color:#155d81;font-weight:700}.main{min-width:0;padding:20px 24px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.heading h1{margin:0;font-size:23px}.board{border:1px solid #dce3e8;border-radius:7px;background:white;overflow:hidden}.tabs{display:flex;gap:4px;padding:0 14px;overflow:auto;white-space:nowrap;border-bottom:1px solid #dce3e8}.tabs button{border:0;background:none;padding:12px;color:#5e6b76}.tabs button.active{color:#17638e;border-bottom:2px solid #17638e;font-weight:700}.tabs small{margin-left:4px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e5eaee}.seg{display:flex;gap:2px;padding:2px;border:1px solid #dce3e8;border-radius:5px;background:#f6f8f9}.seg button{border:0;background:none;padding:5px 12px;border-radius:4px}.seg button.active{background:#fff;font-weight:700;box-shadow:0 1px 3px #152d3918}.toolbar input{height:34px;min-width:230px;border:1px solid #cbd5dc;border-radius:5px;padding:0 9px}.plain{border:1px solid #cbd5dc;background:#fff;border-radius:5px;padding:6px 10px}.count{margin-left:auto;color:#64727c}.query{display:none;padding:12px 14px;background:#fbfcfd;border-bottom:1px solid #e5eaee}.query.open{display:block}.query-head,.query-foot{display:flex;justify-content:space-between;align-items:center}.group{margin-top:8px;padding:10px;border:1px solid #dce3e8;border-radius:5px;background:#fff}.group.nested{margin-left:20px;background:#f8fafb}.rule{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.rule input,.rule select,.group>select{height:34px;padding:4px 8px;border:1px solid #cbd5dc;border-radius:5px;background:#fff}.rule input{flex:1;min-width:150px}.row-actions{display:flex;gap:7px;margin-top:9px}.table{overflow-x:auto}.row{display:grid;grid-template-columns:110px 80px minmax(220px,2.5fr) 115px 95px 100px 100px 60px 100px;gap:8px;align-items:center;min-width:1000px;padding:9px 14px;border-bottom:1px solid #e5eaee}.row.head{background:#f7f9fa;color:#5d6a75;font-size:12px;font-weight:700}.row strong{font-weight:600}.link{color:#155e88}.pagination{display:flex;justify-content:flex-end;padding:10px 14px;color:#5d6a75}.mobile-label{display:none}@media(max-width:650px){.shell{display:block}.nav{display:none}.main{padding:14px}.tabs{padding:0 8px}.toolbar input{min-width:0;flex:1}.seg{width:100%}.seg button{flex:1}.count{width:100%;margin:0}.row.head{display:none}.row{min-width:0;display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px;padding:12px}.mobile-label{display:block;color:#64727c}.group.nested{margin-left:8px}.rule>*{flex:1 1 100%}}
  </style>
</head>
<body><div class="shell"><aside class="nav"><div class="brand">知识中心管理</div><div class="nav-item active">工作台</div><div class="nav-item">任务管理</div><div class="nav-item">文档生产</div><div class="nav-item">审核与发布</div></aside><main class="main"><div class="heading"><h1>我的工作</h1><button class="plain">刷新</button></div><section class="board"><nav class="tabs"><button class="active">全部 <small>28</small></button><button>任务管理 <small>7</small></button><button>文档生产 <small>9</small></button><button>大纲管理 <small>待设计</small></button><button>模板管理 <small>待设计</small></button><button>文档审核 <small>5</small></button><button>文档发布 <small>7</small></button></nav><div class="toolbar"><div class="seg"><button class="active" data-queue>待我处理 18</button><button data-queue>等待他人 10</button></div><input aria-label="搜索编号或标题" placeholder="编号或标题"><button class="plain" id="toggle">查询条件</button><span class="count">18 项 · 第 1/1 页</span></div><section class="query" id="query"><div class="query-head"><strong>查询条件</strong><button class="plain">清空</button></div><div class="group"><select aria-label="条件关系"><option>全部（且）</option><option>任一（或）</option></select><div class="rule"><select aria-label="查询字段"><option>任务类型</option></select><select aria-label="比较方式"><option>等于</option></select><input value="文档发布" aria-label="查询值"><button class="plain">删除</button></div><div class="group nested"><select aria-label="子条件关系"><option>任一（或）</option><option>全部（且）</option></select><div class="rule"><select aria-label="查询字段"><option>版本</option></select><select aria-label="比较方式"><option>等于</option></select><input value="23.4" aria-label="查询值"><button class="plain">删除</button></div><div class="rule"><select aria-label="查询字段"><option>状态</option></select><select aria-label="比较方式"><option>等于</option></select><input value="等待合并" aria-label="查询值"><button class="plain">删除</button></div><div class="row-actions"><button class="plain">+ 条件</button><button class="plain">+ 条件组</button></div></div><div class="row-actions"><button class="plain">+ 条件</button><button class="plain">+ 条件组</button></div></div><div class="query-foot"><span></span><button class="plain" id="apply">应用查询</button></div></section><div class="table"><div class="row head"><span>编号</span><span>子任务编号</span><span>描述</span><span>状态</span><span>任务类型</span><span>开始时间</span><span>结束时间</span><span>详情</span><span>操作</span></div><div class="row"><span class="mobile-label">编号</span><span>YDB-1024</span><span class="mobile-label">子任务编号</span><span>1</span><span class="mobile-label">描述</span><strong>主备切换操作说明</strong><span class="mobile-label">状态</span><span>待在 GitLab 合入</span><span class="mobile-label">任务类型</span><span>文档发布</span><span class="mobile-label">开始时间</span><span>11-03</span><span class="mobile-label">结束时间</span><span>11-08</span><span class="mobile-label">详情</span><span class="link">详情</span><span class="mobile-label">操作</span><span class="link">查看 MR</span></div></div><div class="pagination">上一页　 第 1/1 页　 下一页</div></section></main></div><script>document.querySelector('#toggle').onclick=()=>document.querySelector('#query').classList.toggle('open');document.querySelector('#apply').onclick=()=>document.querySelector('#query').classList.remove('open');document.querySelectorAll('[data-queue]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-queue]').forEach(item=>item.classList.remove('active'));button.classList.add('active')});</script></body></html>
