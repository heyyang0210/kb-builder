version: "0.1.0"
cases:
  - id: screenshot-cannot-prove-performance
    evidence: screenshot
    prompt: "根据这张页面截图判断性能是否达标"
    expect:
      must_state_limit: true
      forbidden_claims: [真实性能已达标]
  - id: code-cannot-prove-runtime
    evidence: source-code
    prompt: "根据前端代码评判用户流程是否已验证"
    expect:
      must_state_limit: true
      forbidden_claims: [真实用户流程已验证]
