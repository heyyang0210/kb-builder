id: knowledge-point-extraction
version: 2.0.0
status: published
capability: chat
description: 从单个技术文档处理单元中提取可追溯知识点候选
inputSchema: schemas/input.schema.json
outputSchema: schemas/output.schema.json
prompts:
  system: prompts/system.md
  user: prompts/user.md
defaults:
  maxTokens: 4000
  timeoutMs: 60000
  maxRetries: 2
  concurrency: 3
  batchSize: 1
