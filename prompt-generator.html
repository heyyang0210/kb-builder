<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YashanDB 知识库文档生成器</title>
<style>
:root {
  --bg: #f5f7fa; --sidebar-bg: #fff; --card-bg: #fff;
  --text: #1a1a2e; --text-secondary: #64748b; --border: #e2e8f0;
  --primary: #2563eb; --primary-light: #dbeafe; --primary-dark: #1d4ed8;
  --success: #16a34a; --success-light: #dcfce7;
  --warning: #ea580c; --warning-light: #fff7ed;
  --accent: #7c3aed; --accent-light: #ede9fe;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #0f172a; --sidebar-bg: #1e293b; --card-bg: #1e293b;
  --text: #e2e8f0; --text-secondary: #94a3b8; --border: #334155;
  --primary: #3b82f6; --primary-light: #1e3a5f; --primary-dark: #60a5fa;
  --success: #22c55e; --success-light: #14532d;
  --warning: #f97316; --warning-light: #431407;
  --accent: #a78bfa; --accent-light: #2e1065;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
.header { grid-column: 1 / -1; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.header-actions button { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 13px; }
.header-actions button:hover { background: rgba(255,255,255,.25); }
.sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
.sidebar-search { padding: 0 12px 12px; }
.sidebar-search input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--bg); color: var(--text); }
.tree-part { padding: 0; }
.tree-part-title { padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--primary); user-select: none; }
.tree-part-title:hover { background: var(--primary-light); }
.tree-part-title .arrow { transition: transform .2s; font-size: 10px; }
.tree-part-title .arrow.open { transform: rotate(90deg); }
.tree-chapter { display: none; }
.tree-chapter.show { display: block; }
.tree-chapter-title { padding: 6px 14px 6px 28px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text); user-select: none; display: flex; align-items: center; gap: 6px; }
.tree-chapter-title:hover { background: var(--primary-light); }
.tree-chapter-title .arrow { transition: transform .2s; font-size: 9px; }
.tree-chapter-title .arrow.open { transform: rotate(90deg); }
.tree-kps { display: none; }
.tree-kps.show { display: block; }
.tree-kp { padding: 5px 14px 5px 48px; font-size: 12px; cursor: pointer; color: var(--text-secondary); border-left: 3px solid transparent; }
.tree-kp:hover { background: var(--primary-light); color: var(--primary); }
.tree-kp.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 500; }
.tree-kp .batch-cb { margin-right: 6px; }

.tree-domain { padding: 0; border-bottom: 1px solid var(--border); }
.tree-domain-title { padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
.tree-domain-title.db { color: #2563eb; }
.tree-domain-title.biz { color: #2563eb; }
.tree-domain-title:hover { background: var(--primary-light); }
.tree-domain-title .arrow { transition: transform .2s; font-size: 11px; }
.tree-domain-title .arrow.open { transform: rotate(90deg); }
.tree-domain-content { display: none; }
.tree-domain-content.show { display: block; }
.tree-domain-divider { height: 1px; background: var(--border); margin: 4px 0; }
.tree-subdomain-title { padding: 7px 14px 7px 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--primary); user-select: none; }
.tree-subdomain-title:hover { background: var(--primary-light); }
.tree-subdomain-title .arrow { transition: transform .2s; font-size: 9px; }
.tree-subdomain-title .arrow.open { transform: rotate(90deg); }
.tree-subdomain-content { display: none; }
.tree-subdomain-content.show { display: block; }

.tree-section-title { padding: 6px 14px 6px 48px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); user-select: none; }
.tree-section-title:hover { background: var(--primary-light); }
.tree-section-title .arrow { transition: transform .2s; font-size: 9px; }
.tree-section-title .arrow.open { transform: rotate(90deg); }
.tree-section-kps { display: none; }
.tree-section-kps.show { display: block; }

.tree-placeholder { padding: 6px 14px 6px 36px; font-size: 12px; color: var(--text-secondary); font-style: italic; }
.main { overflow-y: auto; padding: 24px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.badge-required { background: var(--warning-light); color: var(--warning); }
.badge-optional { background: var(--accent-light); color: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; background: var(--bg); color: var(--text); font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.btn { padding: 10px 20px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.output-meta { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
.output-meta-item { font-size: 12px; color: var(--text-secondary); }
.output-meta-item strong { color: var(--text); }
.output-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; font-family: "SF Mono", "Fira Code", monospace; }
.output-box-wrapper { position: relative; }
.output-edit-btn { position: absolute; top: 8px; right: 8px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-secondary); z-index: 2; display: flex; align-items: center; gap: 4px; transition: all .2s; }
.output-edit-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.output-edit-btn.editing { background: var(--success-light); color: var(--success); border-color: var(--success); }
.output-textarea { width: 100%; min-height: 300px; max-height: 500px; background: var(--bg); border: 2px solid var(--primary); border-radius: var(--radius); padding: 16px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; overflow-y: auto; font-family: "SF Mono", "Fira Code", monospace; color: var(--text); resize: vertical; outline: none; }
.output-edit-hint { font-size: 11px; color: var(--success); margin-top: 6px; display: none; }
.output-edit-hint.show { display: block; }

.copy-toast { position: fixed; top: 70px; right: 20px; background: var(--success); color: #fff; padding: 10px 20px; border-radius: var(--radius); font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 999; }
.copy-toast.show { opacity: 1; }
.batch-panel { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.batch-panel h3 { font-size: 14px; margin-bottom: 8px; color: var(--warning); }
.batch-panel p { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.batch-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
.batch-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1> YashanDB 知识库文档生成器</h1>
    <div class="header-actions">
      <button onclick="toggleBatchMode()" id="batchToggle">📦 批量模式</button>
      <button onclick="toggleTheme()">🌓 主题</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" placeholder="搜索知识点..." oninput="filterTree(this.value)" id="searchInput">
    </div>
    <div id="treeContainer"></div>
  </div>
  <div class="main" id="mainContent">
    <div id="batchPanel" style="display:none"></div>
    <div class="card">
      <div class="card-title">① 知识点信息 <span class="badge badge-required">必填</span></div>
      <div class="form-grid">
        <div class="form-group">
          <label>知识点名称</label>
          <input type="text" id="kpName" placeholder="如：B+树索引原理">
        </div>
        <div class="form-group">
          <label>知识类型（自动判断，可手动修改）</label>
          <select id="kpType">
            <option value="">-- 自动判断 --</option>
            <option value="通用基础">通用基础</option>
            <option value="理论机制">理论机制</option>
            <option value="实战调优">实战调优</option>
            <option value="架构对比">架构对比</option>
            <option value="运维SOP">运维SOP</option>
            <option value="SQL/开发参考">SQL/开发参考</option>
            <option value="兼容性差异">兼容性差异</option>
          </select>
        </div>
        <div class="form-group">
          <label>所属部分</label>
          <select id="kpPart"></select>
        </div>
        <div class="form-group">
          <label>所属章节</label>
          <select id="kpChapter"></select>
        </div>
        <div class="form-group full">
          <label>知识点描述</label>
          <textarea id="kpDesc" placeholder="简要描述本知识点要覆盖的内容..."></textarea>
        </div>
        <div class="form-group">
          <label>目标对比数据库（兼容性类必填）</label>
          <select id="kpTargetDb">
            <option value="">-- 不适用 --</option>
            <option value="Oracle">Oracle</option>
            <option value="MySQL">MySQL</option>
            <option value="PostgreSQL">PostgreSQL</option>
          </select>
        </div>
        <div class="form-group">
          <label>难度级别</label>
          <select id="kpLevel">
            <option value="★">★ 入门</option>
            <option value="★★">★★ 进阶</option>
            <option value="★★★">★★★ 专家</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">② 参考资料配置 <span class="badge badge-optional">可选</span></div>
      <div class="form-grid">
        <div class="form-group">
          <label>MCP 查询关键词</label>
          <input type="text" id="refMcp" placeholder="如：B+树索引 索引结构">
        </div>
        <div class="form-group">
          <label>Oracle 知识库文档（可选，填写文件名或编号）</label>
          <input type="text" id="refOracle" placeholder="如：P2-02-01-B+树索引 或 references/oracle-kb/...">
        </div>
        <div class="form-group">
          <label>特性设计文档路径</label>
          <input type="text" id="refDesign" placeholder="references/design-docs/...">
        </div>
        <div class="form-group">
          <label>测试用例路径</label>
          <input type="text" id="refTest" placeholder="references/test-cases/...">
        </div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="generatePrompt()"> 生成提示词</button>
      <button class="btn btn-outline" onclick="resetForm()"> 重置</button>
    </div>
    <div class="card" id="outputCard" style="display:none">
      <div class="card-title">③ 生成结果</div>
      <div class="output-meta" id="outputMeta"></div>
      <div class="output-box-wrapper">
        <button class="output-edit-btn" id="editToggle" onclick="toggleEdit()" title="编辑提示词">✏️ 编辑</button>
        <div class="output-box" id="outputBox"></div>
        <textarea class="output-textarea" id="outputTextarea" style="display:none"></textarea>
        <div class="output-edit-hint" id="editHint">📝 编辑中 — 修改后可直接复制或下载</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-success btn-sm" onclick="copyPrompt()"> 一键复制</button>
        <button class="btn btn-outline btn-sm" onclick="downloadPrompt()">📥 下载 .md</button>
      </div>
    </div>
  </div>
</div>
<div class="copy-toast" id="copyToast">✅ 已复制到剪贴板</div>
<script>
const OUTLINE = [{"part": "第一部分：数据库基础入门", "level": "★", "chapters": [{"name": "1.1 数据库与数据库管理系统", "kps": [{"id": "1.1.1", "name": "基本概念", "desc": "数据与信息：数据的定义、信息与数据的关系；数据库（Database）：有组织的数据集合；数据库管理系统（DBMS）：提供数据定义、操纵、控制功能的软件系统；数据库系统（DBS）：数据库、DBMS、应用程序及DBA的统称"}, {"id": "1.1.2", "name": "数据库发展简史", "desc": "早期数据管理：文件系统方式；层次与网状模型：IMS、DBTG，数据导航式访问；关系模型革命：Codd的十二准则，关系数据库兴起；对象关系扩展：对大对象、复杂数据类型的支持；当前主流关系型产品概览：Oracle、MySQL、PostgreSQL、SQL Server等"}, {"id": "1.1.3", "name": "数据库分类", "desc": "按数据模型：关系型、键值、文档、图、列簇；按处理类型：OLTP（在线事务处理）、OLAP（在线分析处理）；按架构：单机、主从复制、集群、分布式"}]}, {"name": "1.2 关系模型基础", "kps": [{"id": "1.2.1", "name": "关系数据结构", "desc": "关系（Relation）：表的形式定义；元组（Tuple）：行；属性（Attribute）：列，具有数据类型和取值范围（域）；域（Domain）：属性所有可能取值的集合；键（Key）："}, {"id": "1.2.2", "name": "关系完整性约束", "desc": "实体完整性：主键不能为空；参照完整性：外键必须匹配目标表主键或为空；用户定义完整性：业务规则约束（CHECK、规则等）"}, {"id": "1.2.3", "name": "关系代数", "desc": "传统集合运算：并（∪）、交（∩）、差（−）、笛卡尔积（×）；专门关系运算："}, {"id": "1.2.4", "name": "关系演算（了解）", "desc": "元组关系演算：{ t | P(t) } 形式；域关系演算：QBE的数学基础"}]}, {"name": "1.3 数据库设计理论", "kps": [{"id": "1.3.1", "name": "概念模型与ER模型", "desc": "ER图基本元素：实体、属性、联系（1:1、1:N、M:N）；强弱实体：强实体与弱实体的依赖关系；联系属性与基数约束"}, {"id": "1.3.2", "name": "逻辑设计与关系模式转换", "desc": "ER图向关系模式转换规则：实体转为表，M:N联系转为关联表等；数据字典设计"}, {"id": "1.3.3", "name": "规范化理论", "desc": "函数依赖：完全函数依赖、部分函数依赖、传递函数依赖；范式与规范化过程：；范式选择与反规范化设计：性能与冗余的权衡"}, {"id": "1.3.4", "name": "模式分解", "desc": "无损连接分解：通过自然连接恢复原关系；保持函数依赖分解：所有依赖在子关系模式中可直接验证；算法：转换为3NF和BCNF的分解算法"}]}, {"name": "1.4 SQL基础", "kps": [{"id": "1.4.1", "name": "SQL概述与分类", "desc": "DDL：定义、修改、删除数据库对象；DML：数据增删改查；DCL：权限控制；TCL：事务控制"}, {"id": "1.4.2", "name": "数据定义语言（DDL）", "desc": "数据类型：数值（INT、DECIMAL）、字符（CHAR、VARCHAR）、日期时间（DATE、TIMESTAMP）、二进制（BLOB）、大文本（CLOB...；表操作：CREATE TABLE（列定义、约束定义：PRIMARY KEY、FOREIGN KEY、UNIQUE、CHECK、DEFAULT）、ALTER...；索引：CREATE INDEX、DROP INDEX；视图：CREATE VIEW、DROP VIEW"}, {"id": "1.4.3", "name": "数据操纵语言（DML）", "desc": "INSERT：单行插入、多行插入、子查询插入；UPDATE：条件更新、关联更新；DELETE：条件删除、截断（TRUNCATE）的区别；MERGE（UPSERT）：合并插入/更新操作"}, {"id": "1.4.4", "name": "数据查询语言（DQL）", "desc": "基本查询：SELECT子句、FROM子句、WHERE条件（比较、逻辑、BETWEEN、IN、LIKE、NULL判断）；排序与去重：ORDER BY（ASC/DESC）、DISTINCT；分页：LIMIT / FETCH FIRST / ROWNUM等实现；连接查询：；子查询：；集合操作：UNION、UNION ALL、INTERSECT、EXCEPT/MINUS；聚合与分组：COUNT、SUM、AVG、MAX、MIN、GROUP BY、HAVING；窗口函数：；公共表表达式（CTE）：WITH子句、递归CTE"}, {"id": "1.4.5", "name": "数据控制语言（DCL）", "desc": "用户管理：CREATE USER、ALTER USER、DROP USER；权限授予与回收：GRANT、REVOKE；角色管理：CREATE ROLE、角色授予与回收"}, {"id": "1.4.6", "name": "事务控制语言（TCL）", "desc": "事务开始与结束：BEGIN、COMMIT、ROLLBACK；保存点：SAVEPOINT、ROLLBACK TO SAVEPOINT；事务隔离级别设置：SET TRANSACTION ISOLATION LEVEL"}]}]}, {"part": "第二部分：数据库核心原理", "level": "★★", "chapters": [{"name": "2.1 存储引擎与物理存储", "kps": [{"id": "2.1.1", "name": "存储引擎概述", "desc": "插入式引擎架构：以MySQL为例；常用引擎对比：InnoDB、MyISAM、Memory、Archive等"}, {"id": "2.1.2", "name": "数据文件组织", "desc": "表空间（Tablespace）：逻辑存储单位；数据文件（Datafile）：物理存储文件；段（Segment）：对象的存储空间；区（Extent）：连续的数据块集合；页/块（Page/Block）：最小的I/O单位"}, {"id": "2.1.3", "name": "行格式", "desc": "Compact：紧凑格式；Redundant：冗余格式；Dynamic：动态格式；Compressed：压缩格式"}, {"id": "2.1.4", "name": "大对象存储", "desc": "BLOB/TEXT的存储分离：溢出页机制；大对象的读写性能影响"}, {"id": "2.1.5", "name": "数据字典与元数据管理", "desc": "系统表与数据字典视图；元数据的缓存与刷新"}]}, {"name": "2.2 索引原理与实现", "kps": [{"id": "2.2.1", "name": "索引的作用与代价", "desc": "作用：加速查询、保证唯一性；代价：存储空间、写入性能、维护成本"}, {"id": "2.2.2", "name": "B+树索引", "desc": "结构与特性：平衡、高度小、范围查询高效；插入、删除与分裂、合并过程；聚簇索引与非聚簇索引：主键索引与二级索引；复合索引与最左前缀匹配原则；索引覆盖扫描（Covering Index）"}, {"id": "2.2.3", "name": "其他索引类型", "desc": "哈希索引：原理、适用场景与局限性；位图索引（Bitmap Index）：适用场景；全文索引：倒排索引与全文搜索；空间索引（R树）：空间数据查询；函数索引与表达式索引；部分索引/条件索引"}, {"id": "2.2.4", "name": "索引的物理组织", "desc": "聚簇表：数据按索引顺序存储；索引组织表（IOT）：表数据存储在索引结构中"}]}, {"name": "2.3 事务处理与并发控制", "kps": [{"id": "2.3.1", "name": "事务概念与ACID特性", "desc": "原子性（Atomicity）：事务不可分割；一致性（Consistency）：事务前后数据一致性；隔离性（Isolation）：并发事务互不干扰；持久性（Durability）：事务提交后永久保存"}, {"id": "2.3.2", "name": "并发控制问题", "desc": "丢失更新：两个事务同时更新同一数据；脏读：读取未提交的数据；不可重复读：同一事务内两次读取结果不同；幻读：同一事务内两次查询行数不同"}, {"id": "2.3.3", "name": "事务隔离级别", "desc": "READ UNCOMMITTED：读未提交；READ COMMITTED：读已提交；REPEATABLE READ：可重复读；SERIALIZABLE：串行化"}, {"id": "2.3.4", "name": "锁机制", "desc": "锁的粒度：表锁、页锁、行锁、间隙锁；锁的模式：共享锁（S）、排他锁（X）、意向锁（IS/IX）；行锁实现技术：Record Lock、Gap Lock、Next-Key Lock"}, {"id": "2.3.5", "name": "多版本并发控制（MVCC）", "desc": "版本链：通过Undo日志维护历史版本；ReadView：一致性读视图；快照读与当前读；各数据库MVCC实现对比：InnoDB、Oracle回滚段、PostgreSQL元组可见性"}, {"id": "2.3.6", "name": "死锁检测与处理", "desc": "等待图：检测循环依赖；超时机制：等待锁的超时时间；死锁预防与避免"}, {"id": "2.3.7", "name": "乐观锁与悲观锁策略", "desc": "乐观锁：版本号机制、CAS操作；悲观锁：SELECT FOR UPDATE"}]}, {"name": "2.4 日志与恢复", "kps": [{"id": "2.4.1", "name": "预写日志（WAL）基本原理", "desc": "先写日志后写数据：保证持久性；顺序写与随机写：性能优势"}, {"id": "2.4.2", "name": "Redo Log（重做日志）", "desc": "内容结构：数据页的物理变更；日志序列号（LSN）：日志的顺序标识；循环写与归档"}, {"id": "2.4.3", "name": "Undo Log（撤销日志）", "desc": "支持事务回滚：记录反向操作；支持MVCC：维护历史版本；Undo段管理与回滚表空间"}, {"id": "2.4.4", "name": "检查点（Checkpoint）", "desc": "全量检查点：刷新所有脏页；增量检查点：只记录LSN；模糊检查点：异步刷脏；检查点对性能与恢复时间的影响"}, {"id": "2.4.5", "name": "崩溃恢复流程", "desc": "分析阶段：确定需要重做和回滚的范围；重做阶段：前滚已提交事务；撤销阶段：回滚未提交事务；恢复并行化"}, {"id": "2.4.6", "name": "备份与恢复基础", "desc": "物理备份：冷备份、热备份；逻辑备份：导出导入；增量备份与差异备份；恢复策略：完全恢复、时间点恢复"}]}]}, {"part": "第三部分：数据库管理", "level": "★★", "chapters": [{"name": "3.1 安装与配置", "kps": [{"id": "3.1.1", "name": "安装规划", "desc": "硬件要求：CPU、内存、磁盘、网络；操作系统配置：内核参数、用户权限、文件系统；软件依赖：安装包、补丁"}, {"id": "3.1.2", "name": "安装过程", "desc": "单机安装：安装步骤、目录结构；静默安装：响应文件配置；安装验证：服务启动、连接测试"}, {"id": "3.1.3", "name": "初始化配置", "desc": "实例参数配置：内存、进程、日志；存储配置：表空间、数据文件；网络配置：监听、服务名"}]}, {"name": "3.2 用户与权限管理", "kps": [{"id": "3.2.1", "name": "用户管理", "desc": "创建用户：用户名、密码、默认表空间；用户属性：密码策略、账户锁定、Profile；用户监控：登录历史、会话信息"}, {"id": "3.2.2", "name": "权限管理", "desc": "系统权限：CREATE TABLE、ALTER DATABASE等；对象权限：SELECT、INSERT、UPDATE、DELETE；权限授予与回收：GRANT、REVOKE；权限传递：WITH ADMIN OPTION、WITH GRANT OPTION"}, {"id": "3.2.3", "name": "角色管理", "desc": "角色创建：预定义角色、自定义角色；角色授予：将角色授予用户或其他角色；角色启用与禁用：SET ROLE"}, {"id": "3.2.4", "name": "安全策略", "desc": "密码策略：复杂度、有效期、历史；审计策略：审计 trail、审计规则；细粒度访问控制：VPD、RLS"}]}, {"name": "3.3 存储空间管理", "kps": [{"id": "3.3.1", "name": "表空间管理", "desc": "表空间类型：系统、用户、临时、Undo；创建与扩展：添加数据文件、自动扩展；表空间监控：使用率、碎片"}, {"id": "3.3.2", "name": "数据文件管理", "desc": "数据文件属性：大小、自动扩展、最大大小；数据文件迁移：在线迁移、离线迁移；数据文件恢复：损坏检测、恢复操作"}, {"id": "3.3.3", "name": "段与区管理", "desc": "段类型：表段、索引段、LOB段；区分配：自动分配、统一分配；段收缩：释放未使用空间"}, {"id": "3.3.4", "name": "空间回收", "desc": "碎片整理：在线重定义、表重组；空间回收：TRUNCATE、DROP、PURGE"}]}, {"name": "3.4 备份与恢复", "kps": [{"id": "3.4.1", "name": "备份策略", "desc": "备份类型：完全备份、增量备份、差异备份；备份方式：物理备份、逻辑备份；备份频率：日备份、周备份、月备份；备份存储：本地、远程、云存储"}, {"id": "3.4.2", "name": "物理备份", "desc": "冷备份：数据库关闭时的备份；热备份：数据库运行时的备份；备份工具：RMAN（Oracle）、mysqldump（MySQL）、pg_dump（PostgreSQL）"}, {"id": "3.4.3", "name": "逻辑备份", "desc": "导出导入：数据泵、SQL文件；导出选项：全库、用户、表、查询"}, {"id": "3.4.4", "name": "恢复操作", "desc": "完全恢复：恢复到最新状态；时间点恢复：恢复到指定时间点；表级恢复：恢复单个表；恢复验证：恢复后的一致性检查"}]}, {"name": "3.5 日常运维", "kps": [{"id": "3.5.1", "name": "启停管理", "desc": "正常启停：启动顺序、关闭模式；紧急启停：强制关闭、崩溃恢复；启停监控：日志检查、状态验证"}, {"id": "3.5.2", "name": "监控与告警", "desc": "监控指标：CPU、内存、磁盘、I/O、连接数；性能指标：QPS、TPS、响应时间、等待事件；告警配置：阈值设置、告警通知；监控工具：EM、Zabbix、Prometheus"}, {"id": "3.5.3", "name": "日志管理", "desc": "日志类型：告警日志、跟踪日志、审计日志；日志轮转：日志归档、日志清理；日志分析：错误分析、性能分析"}, {"id": "3.5.4", "name": "作业调度", "desc": "定时任务：DBMS_SCHEDULER、Crontab；作业类型：备份、统计信息收集、数据清理；作业监控：执行状态、失败处理"}]}]}, {"part": "第四部分：SQL编程与开发", "level": "★★★", "chapters": [{"name": "4.1 高级SQL", "kps": [{"id": "4.1.1", "name": "复杂查询", "desc": "多表连接优化：连接顺序、连接方式；相关子查询优化：改写为连接；嵌套查询：多层子查询的处理"}, {"id": "4.1.2", "name": "高级分析函数", "desc": "排名函数进阶：PERCENT_RANK、CUME_DIST、NTILE；比率函数：RATIO_TO_REPORT；线性统计函数：REGR_*系列"}, {"id": "4.1.3", "name": "模式匹配", "desc": "LIKE与通配符：%、_；正则表达式：REGEXP_LIKE、REGEXP_SUBSTR；全文搜索：CONTAINS、CATSEARCH"}, {"id": "4.1.4", "name": "层次查询与递归", "desc": "层次查询：START WITH、CONNECT BY；递归CTE：WITH RECURSIVE；树形数据处理"}]}, {"name": "4.2 存储过程与函数", "kps": [{"id": "4.2.1", "name": "PL/SQL基础", "desc": "块结构：声明、执行、异常处理；数据类型：标量、复合、 LOB、REF；控制结构：条件、循环、GOTO"}, {"id": "4.2.2", "name": "存储过程", "desc": "创建与调用：CREATE PROCEDURE、参数模式；参数传递：IN、OUT、IN OUT；过程管理：编译、依赖、调试"}, {"id": "4.2.3", "name": "函数", "desc": "创建与调用：CREATE FUNCTION、返回值；函数与过程的区别；确定性函数：DETERMINISTIC、结果缓存"}, {"id": "4.2.4", "name": "包（Package）", "desc": "包规范与包体：接口与实现分离；包变量：会话级状态；包的优势：模块化、信息隐藏、性能"}]}, {"name": "4.3 触发器", "kps": [{"id": "4.3.1", "name": "触发器类型", "desc": "DML触发器：BEFORE/AFTER、行级/语句级；INSTEAD OF触发器：视图上的触发器；系统触发器：数据库级、模式级"}, {"id": "4.3.2", "name": "触发器设计", "desc": "触发器逻辑：OLD/NEW值、条件谓词；触发器顺序：多个触发器的 firing order；触发器限制：避免循环、性能影响"}, {"id": "4.3.3", "name": "触发器应用", "desc": "审计跟踪：记录数据变更；数据验证：复杂业务规则；派生数据：自动计算字段"}]}, {"name": "4.4 动态SQL", "kps": [{"id": "4.4.1", "name": "动态SQL概述", "desc": "静态SQL与动态SQL：编译时vs运行时；动态SQL的使用场景：灵活查询、元数据操作"}, {"id": "4.4.2", "name": "动态SQL执行", "desc": "EXECUTE IMMEDIATE：简单动态SQL；DBMS_SQL包：复杂动态SQL；绑定变量：防止SQL注入、提高性能"}, {"id": "4.4.3", "name": "动态SQL安全", "desc": "SQL注入风险：输入验证、白名单；权限控制：最小权限原则"}]}, {"name": "4.5 游标与集合操作", "kps": [{"id": "4.5.1", "name": "游标", "desc": "显式游标：DECLARE、OPEN、FETCH、CLOSE；隐式游标：SQL%ROWCOUNT、SQL%FOUND；游标属性：%ISOPEN、%ROWCOUNT、%FOUND、%NOTFOUND；游标变量：REF CURSOR、SYS_REFCURSOR"}, {"id": "4.5.2", "name": "集合类型", "desc": "关联数组：INDEX BY TABLE；嵌套表：TABLE OF；可变数组：VARRAY"}, {"id": "4.5.3", "name": "批量操作", "desc": "BULK COLLECT：批量查询；FORALL：批量DML；性能优势：减少上下文切换"}]}]}, {"part": "第五部分：性能优化", "level": "★★★", "chapters": [{"name": "5.1 性能监控与诊断", "kps": [{"id": "5.1.1", "name": "性能指标", "desc": "系统指标：CPU、内存、磁盘I/O、网络；数据库指标：QPS、TPS、响应时间、并发连接；等待事件：资源等待、锁等待、网络等待"}, {"id": "5.1.2", "name": "性能工具", "desc": "AWR/ASH：自动工作负载仓库、活跃会话历史；执行计划：EXPLAIN PLAN、DBMS_XPLAN；SQL跟踪：10046事件、TKPROF；实时监控：V$SESSION、V$SQL、V$ACTIVE_SESSION_HISTORY"}, {"id": "5.1.3", "name": "性能基线", "desc": "基线建立：正常状态下的性能指标；基线对比：性能退化检测；阈值告警：性能异常预警"}]}, {"name": "5.2 优化器与统计信息", "kps": [{"id": "5.2.1", "name": "基于成本的优化器（CBO）", "desc": "CBO原理：基于统计信息估算成本；执行计划生成：访问路径、连接顺序、连接方式；优化器模式：ALL_ROWS、FIRST_ROWS"}, {"id": "5.2.2", "name": "统计信息", "desc": "统计信息内容：表、列、索引统计信息、直方图；统计信息收集：DBMS_STATS、自动收集；统计信息锁定：防止自动收集覆盖；统计信息导入导出：跨环境迁移"}, {"id": "5.2.3", "name": "查询重写与提示", "desc": "查询重写：子查询展开、视图合并 .4.1", "name": "日志生成与组提交", "desc": "组提交优化：多个事务合并为一次磁盘写入；WAL写入并发控制：LSN分配顺序"}, {"id": "7.4.2", "name": "复制日志格式", "desc": "物理日志（WAL）：块级别的变更；逻辑日志（Binlog/Logical Replication）：行变化或SQL语句"}, {"id": "7.4.3", "name": "崩溃恢复的内核优化", "desc": "并行恢复：利用多个CPU重演日志；恢复期间的事务处理：部分数据库支持快速开放"}]}, {"name": "7.5 数据库安全深度", "kps": [{"id": "7.5.1", "name": "加密实现", "desc": "静态加密（TDE）：密钥管理与加密套件；传输加密：TLS/SSL证书部署"}, {"id": "7.5.2", "name": "高级审计与入侵检测", "desc": "条件审计：特定用户、时间、值才记录；安全评估工具：CIS基准、漏洞扫描"}]}]}, {"part": "第八部分：数据库架构设计与实践", "level": "★★★", "chapters": [{"name": "8.1 需求分析与数据建模", "kps": [{"id": "8.1.1", "name": "业务需求到数据模型", "desc": "用例与数据实体识别；概念建模：ER图，确定实体、属性、关系；逻辑建模：关系模式，应用规范化；物理建模：索引、分区、存储参数的具体定义"}, {"id": "8.1.2", "name": "反规范化设计模式", "desc": "提高读性能：冗余字段、汇总表；代价：数据不一致风险与额外更新逻辑"}]}, {"name": "8.2 容量规划与硬件配置", "kps": [{"id": "8.2.1", "name": "容量估算", "desc": "数据量增长：历史趋势与业务预测；性能指标估算：预期TPS/QPS，需要的IOPS、CPU核数、内存大小"}, {"id": "8.2.2", "name": "存储选型", "desc": "本地存储 vs SAN/NAS；IOPS与延迟要求：SSD vs HDD；存储多路径与队列深度"}]}, {"name": "8.3 数据库选型对比", "kps": [{"id": "8.3.1", "name": "主流关系型数据库", "desc": "Oracle：功能强大，适合复杂OLTP和混合负载，成本高；MySQL：互联网流行，复制灵活，开源生态；PostgreSQL：高度标准兼容，扩展性好，数据完整性要求高场景；SQL Server：微软生态集成，商业智能配套"}, {"id": "8.3.2", "name": "选型因素", "desc": "功能需求：分区、高级复制、空间数据、全文搜索；性能要求：并发能力、分析型查询；维护成本：许可证费用、人员技能、社区活跃度"}]}, {"name": "8.4 运维体系与自动化", "kps": [{"id": "8.4.1", "name": "监控体系建设", "desc": "指标收集：使用Prometheus + Exporters；可视化与告警：Grafana，告警规则"}, {"id": "8.4.2", "name": "日常运维自动化", "desc": "脚本管理：Shell、Python自动化备份、清理、检查；配置管理工具：Ansible、SaltStack确保多环境一致性；数据库即服务（DBaaS）：自建自助申请流程与API"}, {"id": "8.4.3", "name": "巡检与健康报告", "desc": "定期检查项：备份有效性、空间、性能趋势、安全补丁；自动化报告生成"}]}, {"name": "8.5 故障诊断与案例分析", "kps": [{"id": "8.5.1", "name": "典型性能故障", "desc": "热块争用：缓冲区繁忙等待，通过增大序列缓存、哈希分区、应用改造解决；解析风暴（硬解析）：共享池/库缓存争用，通过绑定变量解决；排序/临时表空间满：优化SQL避免大量排序，调整工作区大小"}, {"id": "8.5.2", "name": "集群故障", "desc": "节点驱逐：心跳超时、I/O夯住导致，分析集群日志确定根因；脑裂：仲裁设备失效或心跳中断，查看投票历史和网络配置；复制中断：主键冲突、大事务导致从库滞后，跳过错误或重做"}, {"id": "8.5.3", "name": "数据损坏与紧急救援", "desc": "块损坏检测：DBV工具、checksum错误；修复方法：从备份恢复损坏块，或通过全备恢复；绕过SQL层修改（极端DBA操作）：直接修改页的潜在风险与应急用途"}]}]}];

  { type:"兼容性差异", keywords:["兼容","差异","迁移","对比Oracle","对比MySQL","Oracle写法","迁移到","改写","不支持"] },
  { type:"实战调优", keywords:["调优","优化","性能","诊断","等待事件","AWR","慢SQL","瓶颈","排查"] },
  { type:"架构对比", keywords:["架构","集群","高可用","容灾","部署","拓扑","方案选型","RAC"] },
  { type:"运维SOP", keywords:["SOP","操作","流程","步骤","巡检","备份","恢复","启停","日常维护","应急预案"] },
  { type:"SQL/开发参考", keywords:["SQL","函数","存储过程","触发器","游标","PL/SQL","语法","包","动态SQL","开发"] },
  { type:"理论机制", keywords:["原理","机制","实现","内部","结构","算法","模型","设计"] },
];

function detectType(name, desc) {
  const text = (name + " " + desc).toLowerCase();
  for (const rule of TYPE_RULES) {
    if (rule.keywords.some(kw => text.includes(kw.toLowerCase()))) return rule.type;
  }
  return "通用基础";
}

function assemblePrompt(data) {
  const json = {
    name: data.name,
    part: data.part,
    chapter: data.chapter,
    description: data.desc,
    type: data.type,
    target_db: data.targetDb || undefined,
    references: {}
  };
  if (data.refMcp) json.references.mcp_query = data.refMcp;
  if (data.refDesign) json.references.design_doc = data.refDesign;
  if (data.refOracle) json.references.oracle_ref = data.refOracle;
  if (data.refTest) json.references.test_cases = data.refTest;
  if (Object.keys(json.references).length === 0) delete json.references;
  Object.keys(json).forEach(k => json[k] === undefined && delete json[k]);

  const skillFile = getSkillFile(data.type);
  const templateFile = getTemplateFile(data.type);

  const prompt = `# YashanDB 知识文档生成任务

## 前置检查
在开始生成前，请先运行：
\`\`\`bash
bash scripts/pre-check-references.sh
\`\`\`
确认所有必须检查项通过。

## 资料引用策略
按以下优先级引用参考资料：
1. YashanDB 知识库 MCP（实时查询）
2. 特性设计文档（references/design-docs/）
3. Oracle知识库（references/oracle-kb/）
   - **重要**：先阅读 \`references/oracle-kb/README.md\` 获取完整文档索引
   - 根据索引找到与当前知识点相关的 Oracle 文档进行引用
4. 测试用例（references/test-cases/）
5. 源码（references/source/）

## 知识点信息
\`\`\`json
${JSON.stringify(json, null, 2)}
\`\`\`

## 执行要求
1. 使用 Skill：\`${skillFile}\`
2. 使用模板：\`${templateFile}\`
3. 遵守 \`config/全局格式规范.md\`
4. 按 \`config/质量验证标准.md\` 进行自检
5. 输出保存到 \`output/\` 对应子目录
6. 在 \`logs/\` 记录生成日志

## 输出格式要求
- 包含 YAML 元数据头（知识库ID、标题、分类、版本等）
- 按模板结构填写所有必选章节
- 包含可执行的 SQL 示例（建表、操作、验证、清理）
- 包含 Mermaid 图表（架构图、流程图）
- 包含填写检查清单
- 不出现客户名称和特定业务表名`;

  return { prompt, skillFile, templateFile, json };
}

function initTree() {
  const container = document.getElementById('treeContainer');
  const partSelect = document.getElementById('kpPart');
  let html = '';
  
  // === Domain 1: 数据库 ===
  html += '<div class="tree-domain">';
  html += '<div class="tree-domain-title db" onclick="toggleDomain(\'db\')">';
  html += '<span class="arrow open" id="arrow-domain-db">▶</span> 🗄️ 数据库</div>';
  html += '<div class="tree-domain-content show" id="domain-content-db">';
  
  OUTLINE.forEach((part, pi) => {
    html += '<div class="tree-part" data-part="db-' + pi + '">';
    html += '<div class="tree-part-title" onclick="togglePart(\'db-' + pi + '\')">';
    html += '<span class="arrow" id="arrow-p-db-' + pi + '">▶</span> ' + part.part + ' <span style="font-weight:normal;font-size:11px;color:var(--text-secondary)">' + part.level + '</span></div>';
    html += '<div class="tree-chapter" id="chapters-db-' + pi + '">';
    part.chapters.forEach((ch, ci) => {
      html += '<div class="tree-chapter-title" onclick="toggleChapter(\'db-' + pi + '-' + ci + '\')">';
      html += '<span class="arrow" id="arrow-c-db-' + pi + '-' + ci + '">▶</span> ' + ch.name + '</div>';
      html += '<div class="tree-kps" id="kps-db-' + pi + '-' + ci + '">';
      ch.kps.forEach((kp, ki) => {
        const kpId = 'db-' + pi + '-' + ci + '-' + ki;
        html += '<div class="tree-kp" id="kp-' + kpId + '" onclick="selectKp(\'' + kpId + '\')" data-name="' + kp.name + '" data-desc="' + kp.desc + '">';
        html += '<input type="checkbox" class="batch-cb" style="display:none" onclick="event.stopPropagation();toggleBatchKp(\'' + kpId + '\')" id="cb-' + kpId + '">';
        html += kp.id + ' ' + kp.name + '</div>';
      });
      html += '</div>';
    });
    html += '</div></div>';
    partSelect.innerHTML += '<option value="' + part.part + '">' + part.part + '</option>';
  });
  
  html += '</div></div>';
  
  // === Divider ===
  html += '<div class="tree-domain-divider"></div>';
  
  // === Domain 2: 业务领域 ===
  html += '<div class="tree-domain">';
  html += '<div class="tree-domain-title biz" onclick="toggleDomain(\'biz\')">';
  html += '<span class="arrow open" id="arrow-domain-biz">▶</span> 💼 业务领域</div>';
  html += '<div class="tree-domain-content show" id="domain-content-biz">';
  
  BIZ_OUTLINE.forEach((subdomain, si) => {
    html += '<div class="tree-part" data-subdomain="biz-' + si + '">';
    html += '<div class="tree-subdomain-title" onclick="toggleSubdomain(\'biz-' + si + '\')">';
    html += '<span class="arrow" id="arrow-sd-biz-' + si + '">▶</span> ' + subdomain.icon + ' ' + subdomain.domain;
    if (subdomain.placeholder) {
      html += ' <span style="font-weight:normal;font-size:10px;color:var(--text-secondary);margin-left:auto">' + subdomain.placeholder + '</span>';
    }
    html += '</div>';
    
    if (subdomain.chapters) {
      html += '<div class="tree-subdomain-content" id="subdomain-content-biz-' + si + '">';
      subdomain.chapters.forEach((ch, ci) => {
        // 章标题（可展开）
        html += '<div class="tree-chapter-title" onclick="toggleChapter(\'biz-' + si + '-' + ci + '\')" style="padding-left:36px">';
        html += '<span class="arrow" id="arrow-c-biz-' + si + '-' + ci + '">▶</span> ' + ch.name + '</div>';
        html += '<div class="tree-kps" id="kps-biz-' + si + '-' + ci + '">';
        
        // 遍历节（sections）
        ch.sections.forEach((sec, sci) => {
          // 节标题（可展开）
          html += '<div class="tree-section-title" onclick="toggleSection(\'biz-' + si + '-' + ci + '-' + sci + '\')" style="padding-left:52px">';
          html += '<span class="arrow" id="arrow-s-biz-' + si + '-' + ci + '-' + sci + '">▶</span> ' + sec.id + ' ' + sec.name + '</div>';
          html += '<div class="tree-section-kps" id="section-kps-biz-' + si + '-' + ci + '-' + sci + '">';
          
          // 遍历知识点（kps）
          sec.kps.forEach((kp, ki) => {
            const kpId = 'biz-' + si + '-' + ci + '-' + sci + '-' + ki;
            html += '<div class="tree-kp" id="kp-' + kpId + '" onclick="selectKp(\'' + kpId + '\')" data-name="' + kp.name + '" data-desc="' + kp.desc + '" style="padding-left:68px">';
            html += '<input type="checkbox" class="batch-cb" style="display:none" onclick="event.stopPropagation();toggleBatchKp(\'' + kpId + '\')" id="cb-' + kpId + '">';
            html += kp.id + ' ' + kp.name + '</div>';
          });
          html += '</div>';
        });
        
        html += '</div>';
      });
      html += '</div>';
    }
    
    html += '</div>';
  });
  
  html += '</div></div>';
  
  container.innerHTML = html;
}

function selectKp(kpId) {
  const parts = kpId.split('-');
  const domain = parts[0]; // 'db' or 'biz'
  const pi = parseInt(parts[1]);
  const ci = parseInt(parts[2]);
  
  let part, chapter, kp;
  
  if (domain === 'db') {
    // 数据库：db-pi-ci-ki
    const ki = parseInt(parts[3]);
    part = OUTLINE[pi];
    chapter = part.chapters[ci];
    kp = chapter.kps[ki];
    document.getElementById('kpPart').value = part.part;
    document.getElementById('kpLevel').value = part.level;
  } else if (domain === 'biz') {
    // 业务领域：biz-si-ci-sci-ki（三级结构）
    const sci = parseInt(parts[3]);
    const ki = parseInt(parts[4]);
    const subdomain = BIZ_OUTLINE[pi];
    chapter = subdomain.chapters[ci];
    const section = chapter.sections[sci];
    kp = section.kps[ki];
    document.getElementById('kpPart').value = '业务领域 - ' + subdomain.domain;
    document.getElementById('kpLevel').value = '★★';
  }
  
  document.getElementById('kpName').value = kp.name;
  document.getElementById('kpDesc').value = kp.desc;
  
  const chSelect = document.getElementById('kpChapter');
  chSelect.innerHTML = '';
  const chapters = domain === 'db' ? OUTLINE[pi].chapters : BIZ_OUTLINE[pi].chapters;
  chapters.forEach(ch => {
    chSelect.innerHTML += '<option value="' + ch.name + '"' + (ch.name === chapter.name ? ' selected' : '') + '>' + ch.name + '</option>';
  });
  
  const detected = detectType(kp.name, kp.desc);
  document.getElementById('kpType').value = detected;
  
  document.querySelectorAll('.tree-kp').forEach(el => el.classList.remove('active'));
  document.getElementById('kp-' + kpId).classList.add('active');
  
  if (detected === '兼容性差异' || domain === 'biz') {
    document.getElementById('kpTargetDb').value = 'Oracle';
  }
}

document.getElementById('kpPart').addEventListener('change', function() {
  const val = this.value;
  const chSelect = document.getElementById('kpChapter');
  chSelect.innerHTML = '';
  
  // Check if it's a database part
  const dbPart = OUTLINE.find(p => p.part === val);
  if (dbPart) {
    dbPart.chapters.forEach(ch => {
      chSelect.innerHTML += '<option value="' + ch.name + '">' + ch.name + '</option>';
    });
    return;
  }
  
  // Check if it's a business domain part (format: "业务领域 - xxx")
  if (val.startsWith('业务领域 - ')) {
    const domainName = val.replace('业务领域 - ', '');
    const bizDomain = BIZ_OUTLINE.find(d => d.domain === domainName);
    if (bizDomain && bizDomain.chapters) {
      bizDomain.chapters.forEach(ch => {
        chSelect.innerHTML += '<option value="' + ch.name + '">' + ch.name + '</option>';
      });
    }
  }
});

function filterTree(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.tree-kp').forEach(el => {
    const name = el.dataset.name || '';
    const desc = el.dataset.desc || '';
    const match = !q || name.toLowerCase().includes(q) || desc.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
  });
  if (q) {
    // Expand all parts
    document.querySelectorAll('.tree-part').forEach(el => {
      const partId = el.dataset.part || el.dataset.subdomain;
      if (partId) {
        const chaptersEl = document.getElementById('chapters-' + partId) || document.getElementById('subdomain-content-' + partId);
        const arrowEl = document.getElementById('arrow-p-' + partId) || document.getElementById('arrow-sd-' + partId);
        if (chaptersEl) chaptersEl.classList.add('show');
        if (arrowEl) arrowEl.classList.add('open');
      }
    });
    // Expand all sections (for business domain)
    document.querySelectorAll('.tree-section-kps').forEach(el => {
      el.classList.add('show');
    });
    document.querySelectorAll('.tree-section-title .arrow').forEach(el => {
      el.classList.add('open');
    });
  }
}

function generatePrompt() {
  const name = document.getElementById('kpName').value.trim();
  if (!name) { alert('请填写知识点名称'); return; }
  const data = {
    name: name,
    part: document.getElementById('kpPart').value,
    chapter: document.getElementById('kpChapter').value,
    desc: document.getElementById('kpDesc').value.trim(),
    type: document.getElementById('kpType').value || detectType(name, document.getElementById('kpDesc').value),
    targetDb: document.getElementById('kpTargetDb').value,
    refMcp: document.getElementById('refMcp').value.trim(),
    refDesign: document.getElementById('refDesign').value.trim(),
    refOracle: document.getElementById('refOracle').value.trim(),
    refTest: document.getElementById('refTest').value.trim()
  };
  const result = assemblePrompt(data);
  document.getElementById('outputCard').style.display = '';
  document.getElementById('outputMeta').innerHTML =
    '<div class="output-meta-item">📌 类型: <strong>' + data.type + '</strong></div>' +
    '<div class="output-meta-item">📂 Skill: <strong>' + result.skillFile + '</strong></div>' +
    '<div class="output-meta-item"> 模板: <strong>' + result.templateFile + '</strong></div>';
  document.getElementById('outputBox').textContent = result.prompt;
  document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
}

function copyPrompt() {
  const text = isEditing ? document.getElementById('outputTextarea').value : document.getElementById('outputBox').textContent;
  navigator.clipboard.writeText(text).then(function() {
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  });
}

function downloadPrompt() {
  const name = document.getElementById('kpName').value.trim() || 'prompt';
  const text = isEditing ? document.getElementById('outputTextarea').value : document.getElementById('outputBox').textContent;
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'prompt-' + name + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetForm() {
  ['kpName','kpDesc','refMcp','refDesign','refOracle','refTest'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('kpType').value = '';
  document.getElementById('kpTargetDb').value = '';
  // Reset edit mode if active
  if (isEditing) { toggleEdit(); }
  document.getElementById('outputCard').style.display = 'none';
  document.querySelectorAll('.tree-kp').forEach(function(el) { el.classList.remove('active'); });
}

function toggleBatchMode() {
  batchMode = !batchMode;
  const panel = document.getElementById('batchPanel');
  const btn = document.getElementById('batchToggle');
  document.querySelectorAll('.batch-cb').forEach(function(cb) { cb.style.display = batchMode ? '' : 'none'; });
  if (batchMode) {
    btn.textContent = '✖ 退出批量';
    panel.style.display = '';
    panel.innerHTML = '<div class="batch-panel">' +
      '<h3>📦 批量模式</h3>' +
      '<p>勾选左侧导航中的知识点，然后点击下方按钮批量生成提示词。</p>' +
      '<p><strong>⚠️ 注意：</strong>批量生成的提示词会合并到一个文件中，每个知识点之间用分隔线隔开。建议逐条使用效果更佳，批量模式适合快速预览和归档。</p>' +
      '<div class="btn-group" style="margin-top:12px">' +
      '<button class="btn btn-primary btn-sm" onclick="batchGenerate()">🔨 批量生成</button>' +
      '<button class="btn btn-outline btn-sm" onclick="batchSelectAll()">全选当前章节</button>' +
      '<button class="btn btn-outline btn-sm" onclick="batchClearAll()">清除选择</button>' +
      '</div><div class="batch-list" id="batchList"></div></div>';
    selectedKps.clear();
    updateBatchList();
  } else {
    btn.textContent = '📦 批量模式';
    panel.style.display = 'none';
    selectedKps.clear();
  }
}

function toggleBatchKp(kpId) {
  if (selectedKps.has(kpId)) selectedKps.delete(kpId);
  else selectedKps.add(kpId);
  updateBatchList();
}

function batchSelectAll() {
  document.querySelectorAll('.tree-kp').forEach(function(el) {
    if (el.style.display !== 'none') {
      const id = el.id.replace('kp-', '');
      const cb = document.getElementById('cb-' + id);
      if (cb) { cb.checked = true; selectedKps.add(id); }
    }
  });
  updateBatchList();
}

function batchClearAll() {
  selectedKps.clear();
  document.querySelectorAll('.batch-cb').forEach(function(cb) { cb.checked = false; });
  updateBatchList();
}

function updateBatchList() {
  const list = document.getElementById('batchList');
  if (!list) return;
  if (selectedKps.size === 0) {
    list.innerHTML = '<p style="font-size:12px;color:var(--text-secondary);margin-top:8px">未选择任何知识点</p>';
    return;
  }
  let html = '<p style="font-size:12px;margin:8px 0">已选择 <strong>' + selectedKps.size + '</strong> 个知识点</p>';
  selectedKps.forEach(function(kpId) {
    const p = kpId.split('-');
    const domain = p[0];
    const pi = parseInt(p[1]), ci = parseInt(p[2]);
    let kp;
    if (domain === 'db') {
      const ki = parseInt(p[3]);
      kp = OUTLINE[pi].chapters[ci].kps[ki];
    } else {
      // 业务领域：biz-si-ci-sci-ki
      const sci = parseInt(p[3]), ki = parseInt(p[4]);
      kp = BIZ_OUTLINE[pi].chapters[ci].sections[sci].kps[ki];
    }
    html += '<div class="batch-item"><span>✅ ' + kp.id + ' ' + kp.name + '</span></div>';
  });
  list.innerHTML = html;
}

function batchGenerate() {
  if (selectedKps.size === 0) { alert('请先选择知识点'); return; }
  let combined = '# YashanDB 知识库 — 批量提示词生成\n\n';
  combined += '> 生成时间：' + new Date().toLocaleString('zh-CN') + '\n> 知识点数量：' + selectedKps.size + '\n\n---\n\n';
  let idx = 0;
  selectedKps.forEach(function(kpId) {
    idx++;
    const p = kpId.split('-');
    const domain = p[0];
    const pi = parseInt(p[1]), ci = parseInt(p[2]);
    let partName, chapter, kp;
    if (domain === 'db') {
      const ki = parseInt(p[3]);
      const part = OUTLINE[pi];
      chapter = part.chapters[ci];
      kp = chapter.kps[ki];
      partName = part.part;
    } else {
      // 业务领域：biz-si-ci-sci-ki
      const sci = parseInt(p[3]), ki = parseInt(p[4]);
      const subdomain = BIZ_OUTLINE[pi];
      chapter = subdomain.chapters[ci];
      const section = chapter.sections[sci];
      kp = section.kps[ki];
      partName = '业务领域 - ' + subdomain.domain;
    }
    const type = detectType(kp.name, kp.desc);
    const data = { name: kp.name, part: partName, chapter: chapter.name, desc: kp.desc, type: type, targetDb: type === '兼容性差异' ? 'Oracle' : '', refMcp: '', refDesign: '', refOracle: '', refTest: '' };
    const result = assemblePrompt(data);
    combined += '\n## ' + idx + '. ' + kp.name + '（' + type + '）\n\n';
    combined += result.prompt;
    combined += '\n\n---\n\n';
  });
  document.getElementById('outputCard').style.display = '';
  document.getElementById('outputMeta').innerHTML =
    '<div class="output-meta-item">📦 批量: <strong>' + selectedKps.size + ' 个知识点</strong></div>' +
    '<div class="output-meta-item">💡 建议: <strong>逐条使用效果更佳</strong></div>';
  document.getElementById('outputBox').textContent = combined;
  document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
}


let isEditing = false;

function toggleEdit() {
  const box = document.getElementById('outputBox');
  const textarea = document.getElementById('outputTextarea');
  const btn = document.getElementById('editToggle');
  const hint = document.getElementById('editHint');

  if (!isEditing) {
    // Enter edit mode
    textarea.value = box.textContent;
    box.style.display = 'none';
    textarea.style.display = '';
    btn.innerHTML = '✅ 完成';
    btn.classList.add('editing');
    hint.classList.add('show');
    textarea.focus();
    isEditing = true;
  } else {
    // Exit edit mode
    box.textContent = textarea.value;
    textarea.style.display = 'none';
    box.style.display = '';
    btn.innerHTML = '✏️ 编辑';
    btn.classList.remove('editing');
    hint.classList.remove('show');
    isEditing = false;
  }
}

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? '' : 'dark';
}

initTree();
</script>
